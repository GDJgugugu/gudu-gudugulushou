    const t = bl.max - bl.life;                       // 已经过去的秒数
    const r = blastRadius(bl);
    const a = clamp(bl.life / Math.max(0.001, C.WAVE_FADE), 0, 1);   // 前段全亮，最后 WAVE_FADE 秒淡出
    if (t < C.WAVE_FLASH && r > 0) {                  // 爆开瞬间的实心闪光（把整片范围先"点亮"一下）
      g.globalAlpha = 0.20 * (1 - t / Math.max(0.001, C.WAVE_FLASH)) * a;
      pixelCircle(g, Math.round(bl.x), Math.round(bl.y), r, pal.flash);
    }
    g.globalAlpha = a;
    const th = Math.max(1, Math.round(C.WAVE_THICK));
    if (th > 1) pixelRing(g, bl.x, bl.y, r, th, pal.ring);                  // 环主体（青柠绿）
    pixelRing(g, bl.x, bl.y, r, 1, pal.edge);                               // 最外 1px 亮边（边界在哪一眼看到）
  }
  g.globalAlpha = 1;
}

/* =========================================================================
 * 碰撞 —— 像素级精确判定
 * 直接比对双方精灵的不透明像素，所以判定边界就是「看得见的轮廓」：
 * 不会再出现矩形判定框比怪物胖一圈、明明没碰到却被吃 / 被打死的情况。
 * ========================================================================= */

/** 玩家精灵这一帧实际画在哪（含呼吸浮动，与 drawPlayerSprite 用的是同一份计算） */
function playerDrawPos() {
  const P = CONFIG.PLAYER;
  return {
    x: Math.round(Player.x),
    y: Math.round(Player.y + Math.round(Math.sin(Player.bob) * P.BOB_AMP)),
    w: P.W,
    h: P.H,
  };
}

/**
 * 玩家与一个「轴对齐」精灵是否真的碰到（逐像素比对）。
 * sx / sy = 该精灵左上角在画布上的整数坐标。
 */
function hitsPlayerAt(mask, sx, sy) {
  const pp = playerDrawPos(), pm = Assets.mask.player;
  if (pp.x + pp.w <= sx || sx + mask.w <= pp.x) return false;
  if (pp.y + pp.h <= sy || sy + mask.h <= pp.y) return false;
  const x0 = Math.max(0, sx - pp.x), x1 = Math.min(pp.w, sx + mask.w - pp.x);
  const y0 = Math.max(0, sy - pp.y), y1 = Math.min(pp.h, sy + mask.h - pp.y);
  for (let y = y0; y < y1; y++) {
    const pr = y * pp.w, mr = (y + pp.y - sy) * mask.w;
    for (let x = x0; x < x1; x++) {
      if (pm.m[pr + x] && mask.m[mr + x + pp.x - sx]) return true;
    }
  }
  return false;
}

/**
 * 玩家与一个「绕中心旋转 rot 弧度」的精灵是否真的碰到。
 * 把画布像素反向旋转回精灵本地坐标再查掩码，和绘制时的变换严格对应。
 */
function hitsPlayerRot(mask, cx, cy, rot) {
  const pp = playerDrawPos(), pm = Assets.mask.player;
  const cs = Math.abs(Math.cos(rot)), sn = Math.abs(Math.sin(rot));
  const bw = mask.w * cs + mask.h * sn, bh = mask.w * sn + mask.h * cs;
  if (pp.x + pp.w <= cx - bw / 2 || cx + bw / 2 <= pp.x) return false;
  if (pp.y + pp.h <= cy - bh / 2 || cy + bh / 2 <= pp.y) return false;

  const c = Math.cos(rot), s = Math.sin(rot), hw = mask.w / 2, hh = mask.h / 2;
  const x0 = Math.max(0, Math.floor(cx - bw / 2) - pp.x), x1 = Math.min(pp.w, Math.ceil(cx + bw / 2) - pp.x);
  const y0 = Math.max(0, Math.floor(cy - bh / 2) - pp.y), y1 = Math.min(pp.h, Math.ceil(cy + bh / 2) - pp.y);
  for (let y = y0; y < y1; y++) {
    const pr = y * pp.w, dy = y + pp.y - cy;
    for (let x = x0; x < x1; x++) {
      if (!pm.m[pr + x]) continue;
      const dx = x + pp.x - cx;
      const lx = Math.round(c * dx + s * dy + hw);
      const ly = Math.round(-s * dx + c * dy + hh);
      if (lx < 0 || ly < 0 || lx >= mask.w || ly >= mask.h) continue;
      if (mask.m[ly * mask.w + lx]) return true;
    }
  }
  return false;
}

/** 玩家与实际画出来的那个掉落食物是否真碰到（位置/旋转与 drawItem 完全一致） */
function hitPlayerItem(it) {
  const mask = Assets.mask.food[spriteTypeOf(it.type)];
  if (it.spin) return hitsPlayerRot(mask, Math.round(it.curX + it.w / 2), Math.round(it.y + it.h / 2), it.rot);
  return hitsPlayerAt(mask, Math.round(it.curX), Math.round(it.y));
}

/** 玩家与实际画出来的那个泡泡是否真碰到（位置与 render 里一致） */
function hitPlayerBubble(b) {
  return hitsPlayerAt(Assets.mask.bubble[b.r], Math.round(b.x - b.r - 1), Math.round(b.y - b.r - 1));
}

/**
 * 加分 / 扣分。
 * 只改内存里的分数，不在这里写 DOM —— 一次连锁爆炸会连着调几十次（每个被吃掉的食物一次），
 * 每次都写 DOM 就是几十次强制重排（实测每次 ~0.1ms，一帧能吃掉 3ms）。
 * 侧栏在每帧末尾由 UI.update() 统一刷一次，视觉上完全一样（同一帧内就更新了）。
 */
function addScore(v) {
  GameState.score += v;
}

function killPlayer() {
  if (GameState.mode !== 'playing') return;
  // 先把状态切成 dying：后面几件附属事情（音效 / 写盘 / 粒子）就算失败，也已经死掉了
  GameState.mode = 'dying';
  GameState.eatTimer = 0;      // 死亡瞬间收起吃东西表情，结束界面恢复常态
  GameState.deathTimer = 0;
  GameState.flash = CONFIG.DEATH.FLASH_TIME;
  FAULT.run('死亡·音效', function () { Sound.playSfx('die'); });
  FAULT.run('死亡·写盘', function () { Records.flush(); });          // 死亡时把纪录立刻写盘
  FAULT.run('死亡·粒子', function () { spawnDeathParticles(); });
}

/* =========================================================================
 * 输入 —— 角色横向跟随鼠标 / 手指指针（A、D、←、→ 为备用操作）
 * ========================================================================= */
/* aimLock：竖屏左右移动键被按住期间置 true —— 这期间不理会指针瞄准，
   否则鼠标/手指停在按钮上会把角色往按钮那个 x 拉，和按键方向互相打架 */
const input = { aimX: null, rawX: null, rawY: null, keyLeft: false, keyRight: false, aimLock: false };

/** 屏幕坐标 → 画布逻辑坐标（不夹取；暂停菜单的悬停高亮与命中判断用） */
function canvasPoint(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  if (!rect.width) return null;
  return { x: (clientX - rect.left) * (W / rect.width), y: (clientY - rect.top) * (H / rect.height) };
}

/** 把屏幕坐标换算成画布逻辑 x，夹到角色中心可到达的区间 */
function aimAt(clientX, clientY) {
  const p = canvasPoint(clientX, clientY);
  if (!p) return;
  input.rawX = p.x;
  input.rawY = p.y;
  const half = CONFIG.PLAYER.W / 2;
  input.aimX = clamp(p.x, CONFIG.PLAYER.MARGIN + half, W - CONFIG.PLAYER.MARGIN - half);
}
/**
 * 触摸点是不是落在「界面控件」上（侧栏 / 按钮）。
 * 落在这类地方就不抢角色控制权：手机上按静音、暂停，或者随手搭在侧栏上，
 * 角色都不该瞬移过去。
 *
 * 注意不能写成 closest('.panel')：画布外面那层 <main class="panel center"> 也是 .panel，
 * 那样会把「触摸画布」一并判成 UI，手机上就完全没法操作角色了（必须是 aside.side）。
 * 鼠标不受这条限制 —— 桌面上确实有人喜欢把鼠标移出画面遥控角色。
 */
function touchOnUI(target) {
  return !!(target && target.closest && target.closest('aside.side, button, .ctl'));
}
function onAimEvent(e) {
  FAULT.run('输入·瞄准', function () {
    if (input.aimLock) return;                                   // 按住左右移动键时不抢控制权
    if (e.pointerType === 'touch' && touchOnUI(e.target)) return;
    aimAt(e.clientX, e.clientY);
  });
}
window.addEventListener('pointermove', onAimEvent, { passive: true });
window.addEventListener('pointerdown', onAimEvent, { passive: true });

/* 兜底：很老的手机浏览器（iOS 12 / 老安卓）没有 Pointer Events，
   这时用 touch 事件顶上；有 PointerEvent 的浏览器完全不走这段，不会重复处理 */
if (!window.PointerEvent) {
  const onTouch = function (e) {
    const t = e.touches && e.touches[0];
    if (!t || touchOnUI(e.target)) return;
    aimAt(t.clientX, t.clientY);
  };
  window.addEventListener('touchstart', onTouch, { passive: true });
  window.addEventListener('touchmove', onTouch, { passive: true });
}

/* =========================================================================
 * 容错层 —— 让「局部出问题」不影响整体进程
 *
 * 思路：把游戏切成一个个可以独立失败的模块（每帧的逻辑环节、每个渲染环节、
 * 每个实体、每个事件处理器、每个启动步骤），每个模块外面套一层保护：
 *   · 出错只按名字记录前 LOG_LIMIT 次，避免一帧几百条把控制台刷爆；
 *   · 某个名字连续出错到 DISABLE_AFTER 次，就把它永久停掉（降级运行），
 *     这样即使某个子系统彻底坏了，剩下的部分照样能玩；
 *   · 用 FAULT.stats() 可以随时看到「谁出过错、谁被停用了」，方便排查。
 *
 * 之前的做法是在主循环最外面套一个大 try/catch，问题是一旦 update 抛异常，
 * 这一帧的 render 就被整个跳过 —— 画面会彻底冻住，看起来像死机。
 * 现在每个环节各自兜底：坏的那一环跳过，其它环节照常推进、照常出画面。
 * ========================================================================= */
const FAULT = {
  LOG_LIMIT: 3,        // 每个名字最多打印几次错误
  DISABLE_AFTER: 90,   // 同一个名字出错这么多次后永久停用（降级运行）
  counts: {},          // 名字 → 出错次数
  disabled: {},        // 名字 → true 表示已停用
  lastError: null,     // 最近一次错误（排查用）

  report: function (label, e) {
    this.lastError = { label: label, error: e };
    const n = this.counts[label] = (this.counts[label] || 0) + 1;
    const c = window.console;
    if (n === this.DISABLE_AFTER) {
      this.disabled[label] = true;
      if (c && c.warn) c.warn('[咕嘟咕噜兽] 「' + label + '」反复出错，已停用该模块，游戏继续运行。');
      return;
    }
    if (n <= this.LOG_LIMIT && c && c.error) {
      c.error('[咕嘟咕噜兽] 「' + label + '」出错（第 ' + n + ' 次，已跳过这一步）：', e);
    }
  },

  /** 跑一个可能出错的模块：出错就返回 fallback，调用方完全不用管 */
  run: function (label, fn, fallback) {
    if (this.disabled[label]) return fallback;
    try {
      return fn();
    } catch (e) {
      this.report(label, e);
      return fallback;
    }
  },

  /** 这个模块还活着吗（被停用后返回 false） */
  ok: function (label) { return !this.disabled[label]; },

  /** 排查用：谁出过错、谁被停用了 */
  stats: function () {
    return { counts: this.counts, disabled: Object.keys(this.disabled), last: this.lastError };
  },
};

/* =========================================================================
 * 更新（固定步长）
 * ========================================================================= */

/**
 * 更新单个掉落食物。
 * 返回 true = 该把它从列表里移除（吃到了 / 出界了 / 已经并进堆积层）。
 * 拆成独立函数，是为了让「某一个食物出问题」只影响它自己（见 updateItems）。
 */
function stepItem(it, dt, speedMul) {
  it.update(dt, speedMul);

  // 吃到（像素级：看得见碰到了才算）
  if (hitPlayerItem(it)) {
    addScore(scoreOf(it.type));
    Sound.playSfx(eatSoundOf(it.type));                  // 吃东西音效（按食物种类）
    GameState.eatTimer = CONFIG.PLAYER.EAT_FRAME_TIME;   // 换吃东西表情（连续吃会重新计时）
    if (it.type === 'lime') {
      GameState.limeTimer = CONFIG.LIME.DURATION;        // 重置/延长，不叠加
    }
    return true;
  }

  // 穿透过堆积层的食物：继续正常飘落，到底后消失
  if (it.pass) return it.y >= H;

  // 落地 → 进入堆积层；若落点那几列已经堆满，则改为穿过去
  if (StackSystem.landed(it)) {
    if (StackSystem.fullAt(it.curX, it.type) || !StackSystem.add(it)) it.pass = true;
    else return true;
  }
  return false;
}

/** 遍历所有掉落食物：谁出问题就丢掉谁，不影响其余食物，也不影响这一帧的其它环节 */
function updateItems(dt, speedMul) {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    let remove = false;
    try {
      remove = stepItem(it, dt, speedMul);
    } catch (e) {
      FAULT.report('逻辑·单个食物', e);
      remove = true;                 // 这个食物状态已经不可信了，直接移除，避免每帧都炸
    }
    if (remove) items.splice(i, 1);
  }
}

/** 遍历所有泡泡；返回 true = 玩家被撞到（本帧逻辑到此为止） */
function updateBubbles(dt, speedMul) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (b.dead) { bubbles.splice(i, 1); continue; }   // 被连锁引爆点着的，直接清出去
    let action = null;
    try {
      b.update(dt, speedMul);
      if (b.y + b.r < -4) action = 'remove';
      else if (hitPlayerBubble(b)) action = (limeActive() && CONFIG.LIME.CRUSH.ENABLED) ? 'crush' : 'die';
    } catch (e) {
      FAULT.report('逻辑·单个泡泡', e);
      action = 'remove';
    }
    if (action === 'remove') { bubbles.splice(i, 1); continue; }
    if (action === 'crush') {
      // 青柠无敌：泡泡被撞爆（泡泡先移除，再炸堆积物 —— 爆点算炸不炸得动都不影响已移除的泡泡）
      bubbles.splice(i, 1);
      FAULT.run('逻辑·无敌冲撞', function () { crushBubble(b, 0, true); });
      continue;
    }
    if (action === 'die') {
      FAULT.run('逻辑·玩家死亡', killPlayer);
      return true;
    }
  }
  return false;
}

/** 计时：存活时间 / 青柠效果剩余 / 吃东西表情剩余 */
function updateTimers(dt) {
  GameState.elapsed += dt;
  if (GameState.limeTimer > 0) {
    GameState.limeTimer = Math.max(0, GameState.limeTimer - dt);
  }
  if (GameState.eatTimer > 0) GameState.eatTimer = Math.max(0, GameState.eatTimer - dt);
}

/** 死亡演出推进（粒子 + 白闪 → 进入结算界面） */
function updateDying(dt) {
  GameState.deathTimer += dt;
  updateParticles(dt);
  updateBlasts(dt);        // 死亡演出里也要推进，否则刚炸开的环会定格在结算画面上
  if (GameState.flash > 0) GameState.flash -= dt;
  if (GameState.deathTimer >= CONFIG.DEATH.WAIT) {
    GameState.mode = 'gameover';
    UI.syncScore(true);
  }
}

function update(dt) {
  if (GameState.mode === 'menu') {
    // 菜单里角色也有呼吸感
    FAULT.run('逻辑·菜单呼吸', function () { Player.bob += dt * CONFIG.PLAYER.BOB_SPEED; });
    return;
  }

  // 暂停：整个游戏逻辑（含存活计时、下落、泡泡、尘埃）全部冻结
  if (GameState.mode === 'paused') return;

  if (GameState.mode === 'dying') {
    FAULT.run('逻辑·死亡演出', function () { updateDying(dt); });
    return;
  }

  if (GameState.mode === 'gameover') return;

  /* ---------- playing：下面每个环节都各自兜底，坏一个不影响其它 ---------- */
  FAULT.run('逻辑·计时', function () { updateTimers(dt); });
  FAULT.run('逻辑·玩家', function () { Player.update(dt, input); });

  // 生成器：出问题时用 1（原速）继续，不要让难度系数变成 NaN 把整个画面带崩
  let speedMul = 1;
  speedMul = FAULT.run('逻辑·生成', function () { return Spawner.update(dt); }, 1);
  if (typeof speedMul !== 'number' || !isFinite(speedMul) || speedMul <= 0) speedMul = 1;

  FAULT.run('逻辑·食物', function () { updateItems(dt, speedMul); });
  FAULT.run('逻辑·泡泡', function () { updateBubbles(dt, speedMul); });
  // 碎屑粒子 + 范围指示环：撞碎泡泡的特效在游戏中也得存活/消散（原来只有死亡演出里推进）
  FAULT.run('逻辑·粒子', function () { updateParticles(dt); });
  FAULT.run('逻辑·冲击波', function () { updateBlasts(dt); });
}

/* =========================================================================
 * 渲染
 * ========================================================================= */
const canvas = document.getElementById('game');
const appEl = document.getElementById('app');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const BLINK_MS = 450;
function blinkOn() { return Math.floor(performance.now() / BLINK_MS) % 2 === 0; }

function drawPlayerSprite(g) {
  const pos = playerDrawPos();
  drawPlayerFrameAt(g, Assets.player[playerFrameIndex()], pos.x, pos.y);
}

/** 把一张玩家帧居中画进 W×H 的判定框（FIT_FRAMES 打开时各帧尺寸已一致，这里居中只是兜底） */
function drawPlayerFrameAt(g, img, x, y) {
  g.drawImage(img, x + ((CONFIG.PLAYER.W - img.width) >> 1), y + ((CONFIG.PLAYER.H - img.height) >> 1));
}

/** 画一个下落中的食物（含旋转摆动）—— 穿透堆积层的也用同一套画法 */
function drawItem(g, it) {
  const img = Assets.food[spriteTypeOf(it.type)];
  if (it.spin) {
    g.save();
    g.translate(Math.round(it.curX + it.w / 2), Math.round(it.y + it.h / 2));
    g.rotate(it.rot);
    g.drawImage(img, -img.width / 2, -img.height / 2);
    g.restore();
  } else {
    g.drawImage(img, Math.round(it.curX), Math.round(it.y));
  }
}

/* 每个渲染环节进来时都把画布状态复位：这样某个环节中途出错留下的
   globalAlpha / 合成模式不会污染后面的环节（各环节互相独立） */
function resetDraw(g) {
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
}

/** 背景（内嵌像素图；解码失败时用程序化渐变兜底） */
function drawBgLayer(g) {
  resetDraw(g);
  g.drawImage(Assets.bg, 0, 0);
}

/** 掉落食物：全部画在堆积层之前，堆积层堆满后会照样把它们遮住 */
function drawItemsLayer(g) {
  resetDraw(g);
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    try {
      drawItem(g, it);
    } catch (e) {
      FAULT.report('画面·单个食物', e);   // 某个食物画不出来就跳过它，别的照画
    }
  }
}

/** 泡泡（青柠无敌期整体变金色；位置/尺寸与碰撞完全一致） */
function drawBubblesLayer(g) {
  resetDraw(g);
  for (let i = 0; i < bubbles.length; i++) {
    const b = bubbles[i];
    if (b.dead) continue;                     // 同一帧里被连锁点着的，不再画
    try {
      g.drawImage(bubbleSpriteOf(b), Math.round(b.x - b.r - 1), Math.round(b.y - b.r - 1));
    } catch (e) {
      FAULT.report('画面·单个泡泡', e);
    }
  }
}

/** 玩家（死亡演出期间闪烁） */
function drawPlayerLayer(g) {
  resetDraw(g);
  if (GameState.mode === 'dying' && Math.floor(GameState.deathTimer * 24) % 2 !== 0) return;
  drawPlayerSprite(g);
}

/** 堆积层：绘制在所有元素之上（穿透过堆积层的食物也一并被遮住） */
function drawStackLayer(g) {
  resetDraw(g);
  StackSystem.draw();
  g.globalAlpha = CONFIG.STACK.ALPHA;
  g.drawImage(StackSystem.layer, 0, 0);
  g.globalAlpha = 1;
}

/** 爆炸粒子 */
function drawParticlesLayer(g) {
  resetDraw(g);
  for (let i = 0; i < GameState.particles.length; i++) {
    const p = GameState.particles[i];
    g.globalAlpha = clamp(p.life / p.max, 0, 1);
    px(g, Math.round(p.x), Math.round(p.y), p.size, p.size, p.color);
  }
  g.globalAlpha = 1;
}

/** 死亡白屏闪烁 */
function drawFlashLayer(g) {
  resetDraw(g);
  if (GameState.flash <= 0) return;
  g.fillStyle = 'rgba(255,255,255,' + (0.75 * (GameState.flash / CONFIG.DEATH.FLASH_TIME)).toFixed(3) + ')';
  g.fillRect(0, 0, W, H);
}

/** 结算 / 暂停界面（覆盖在最上层） */
function drawOverlayLayer(g) {
  resetDraw(g);
  if (GameState.mode === 'gameover') renderGameOver(g);
  else if (GameState.mode === 'paused') renderPause(g);
}

/**
 * 渲染总入口：按环节依次调用，每个环节各自兜底。
 * 以前是一个大函数、外面只包了一层 try/catch —— 中间任何一处出错，后面的环节
 * （包括玩家、堆积层、结算界面）就全都不画了，画面会定格。现在互不影响。
 */
function render() {
  const g = ctx;
  FAULT.run('画面·背景', function () { drawBgLayer(g); });

  if (GameState.mode === 'menu') {
    FAULT.run('画面·开始界面', function () { renderMenu(g); });
    return;
  }

  FAULT.run('画面·食物', function () { drawItemsLayer(g); });
  FAULT.run('画面·泡泡', function () { drawBubblesLayer(g); });
  FAULT.run('画面·玩家', function () { drawPlayerLayer(g); });
  FAULT.run('画面·堆积层', function () { drawStackLayer(g); });
  FAULT.run('画面·冲击波', function () { drawBlastsLayer(g); });
  FAULT.run('画面·粒子', function () { drawParticlesLayer(g); });
  FAULT.run('画面·白闪', function () { drawFlashLayer(g); });
  FAULT.run('画面·叠加界面', function () { drawOverlayLayer(g); });
}

/**
 * 暂停菜单的按钮布局（画布逻辑坐标）。
 * 绘制和命中判断共用这一份，避免两边各写一次导致错位。
 */
function pauseLayout() {
  const P = CONFIG.PAUSE;
  /* 只留「退出游戏」；想再加按钮就往这个数组里加一项，并在 pauseAction 里补一个分支 */
  const list = [['quit', '退出']];
  const bx = Math.round((W - P.BTN_W) / 2);
  const buttons = list.map(function (b, i) {
    return { id: b[0], label: b[1], x: bx, y: P.BTN_TOP + i * (P.BTN_H + P.BTN_GAP), w: P.BTN_W, h: P.BTN_H };
  });
  const last = buttons[buttons.length - 1];
  return {
    buttons: buttons,
    panel: { x: bx - P.PANEL_PAD_X, y: P.PANEL_TOP,
             w: P.BTN_W + P.PANEL_PAD_X * 2, h: last.y + last.h + P.PANEL_PAD_BOTTOM - P.PANEL_TOP },
  };
}

/** 画布逻辑坐标落在哪个暂停按钮上（没有则返回 null） */
function pauseButtonAt(x, y) {
  const buttons = pauseLayout().buttons;
  for (let i = 0; i < buttons.length; i++) {
    const b = buttons[i];
    if (x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) return b.id;
  }
  return null;
}

/* =========================================================================
 * 画布内界面的皮肤
 * 配色直接从 <style> 的 :root 变量里读，于是「DOM 侧栏」和「画布内的开始/暂停/结束界面」
 * 永远共用一套配色 —— 换肤只要改 CSS 里那几个 --ui-* 变量，不用两头改。
 * ========================================================================= */
/** 画布内界面里中文用的字体（暂停 / 开始界面共用） */
const UI_FONT = '"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif';

const THEME = (function () {
  const cs = getComputedStyle(document.documentElement);
  const v = function (name, fallback) {
    const s = (cs.getPropertyValue(name) || '').trim();
    return s || fallback;
  };
  /* 把 '#rrggbb' / '#rgb' 调成带透明度的 rgba()；万一被改成 rgb() 或颜色名就原样返回
     （那种情况下半透明不生效，但至少不会画错颜色） */
  const withAlpha = function (col, a) {
    const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(col == null ? '' : col).trim());
    if (!m) return col;
    let h = m[1];
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    const n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  };
  const panelBg = v('--ui-panel-bg', '#251a2c');   // 面板底色（DOM 侧栏与画布内界面共用）
  const VEIL_BG = '#0e0712';               // 遮罩底色（深紫黑）
  return {
    out:     v('--ui-outline',  '#0c0710'),
    lineDim: v('--ui-line-dim', '#4b2b40'),
    line:    v('--ui-line',     '#7c4a69'),
    panel:   v('--ui-panel-bg', '#251a2c'),
    panelHi: v('--ui-panel-hi', '#33233c'),
    ink:     v('--ui-ink',      '#f4e7ef'),
    inkDim:  v('--ui-ink-dim',  '#ad90a9'),
    mint:    v('--ui-mint',     '#8fe0bd'),
    coral:   v('--ui-coral',    '#ff8492'),
    sand:    v('--ui-sand',     '#f6c98a'),
    lilac:   v('--ui-lilac',    '#cdb4e8'),   // 历史纪录（与 DOM 的 .value.record 同色）
    shade:   'rgba(6,3,10,0.85)',    // 文字下方的硬投影（像素风立体感）
    veil:    withAlpha(VEIL_BG, CONFIG.PAUSE.VEIL_ALPHA),  // 暂停遮罩（半透明档位见 CONFIG.PAUSE）
    veilEnd: withAlpha(VEIL_BG, 0.80),                     // 结束遮罩（结算要看得清，照旧压暗一档）
  };
})();

/**
 * 像素风圆角矩形：角上按 45° 削出台阶（radius = 每角削掉几级台阶，1 级 = 1 像素）。
 * 画布是纯像素画，用 ctx.roundRect 的平滑圆弧会和整幅画格格不入，所以圆角也做成阶梯状。
 */
function pxRoundRect(g, x, y, w, h, radius, color) {
  const R = Math.max(0, Math.min(radius, (w >> 1), (h >> 1)));
  g.fillStyle = color;
  if (!R) { g.fillRect(x, y, w, h); return; }
  for (let i = 0; i < h; i++) {
    const d = Math.max(0, R - i, i - (h - 1 - R));      // 该行左右各缩进几像素
    g.fillRect(x + d, y + i, w - d * 2, 1);
  }
}

/** 像素风面板：外黑框 → 中描边 → 主描边 → 底色，顶部再压 2px 高光（和 DOM 侧栏 .panel 同款）
    四层半径自外向内递减，于是每层圆角平行、看起来是同心圆角 */
function drawPixelPanel(g, x, y, w, h, fill) {
  pxRoundRect(g, x - 6, y - 6, w + 12, h + 12, 7, THEME.out);
  pxRoundRect(g, x - 3, y - 3, w + 6, h + 6, 6, THEME.lineDim);
  pxRoundRect(g, x, y, w, h, 5, THEME.line);
  pxRoundRect(g, x + 3, y + 3, w - 6, h - 6, 4, fill || THEME.panel);
  px(g, x + 7, y + 3, w - 14, 2, THEME.panelHi);        // 顶部高光：两端各内缩，正好贴住圆角
}

/**
 * 把「一整块画好的东西」半透明地贴回主画布。
 * 面板和按钮都是一层层不透明描边叠出来的（外黑框 → 中描边 → 主描边 → 底色），
 * 直接给每层单独调 alpha 会互相打架：内部那几层叠起来仍然接近不透明，等于没透明。
 * 所以先照原样画进离屏缓冲，再整块带 alpha 贴回来 —— 外框的像素样子一点不变，只是整体变半透明。
 * 缓冲按需扩容、不缩容：暂停界面每帧贴「面板内部 / 面板外框 / 按钮」几次，开销就是几次 drawImage。
 */
const panelBuf = { c: null, g: null, w: 0, h: 0 };
function blitAlpha(g, x, y, w, h, alpha, draw) {
  if (!panelBuf.c) {
    panelBuf.c = makeCanvas(w, h, true);
    panelBuf.w = w; panelBuf.h = h;
  } else if (panelBuf.w < w || panelBuf.h < h) {
    panelBuf.w = Math.max(panelBuf.w, w);
    panelBuf.h = Math.max(panelBuf.h, h);
    panelBuf.c.width = panelBuf.w;
    panelBuf.c.height = panelBuf.h;
  }
  const bg = panelBuf.g || (panelBuf.g = panelBuf.c.getContext('2d', { willReadFrequently: true }));
  bg.imageSmoothingEnabled = false;
  bg.globalAlpha = 1;
  bg.globalCompositeOperation = 'source-over';
  bg.clearRect(0, 0, panelBuf.w, panelBuf.h);
  bg.save();
  bg.translate(-x, -y);        // 让 draw() 直接用主画布的坐标画，不用换算
  draw(bg);
  bg.restore();
  g.globalAlpha = alpha;
  g.drawImage(panelBuf.c, 0, 0, w, h, x, y, w, h);
  g.globalAlpha = 1;
}

/** 把刚画好的东西「内部掏空」：只留框线（destination-out 只在离屏缓冲上用，不碰主画布） */
function punchInterior(g, x, y, w, h, radius) {
  g.globalCompositeOperation = 'destination-out';
  pxRoundRect(g, x, y, w, h, radius, '#000');
  g.globalCompositeOperation = 'source-over';
}

/** 面板的「框」单独一层：照原样画整块，再把内部挖掉 —— 于是缓冲上只剩外框 */
function drawPixelPanelFrame(g, x, y, w, h) {
  drawPixelPanel(g, x, y, w, h);
  punchInterior(g, x + 3, y + 3, w - 6, h - 6, 4);
}

/**
 * 带描边的像素风文字：先绕一圈描边色，再把本体压上去。
 * 描边按整数像素涂 8 个方向（第 r 圈只涂 max(|dx|,|dy|) === r 的那些点，避免重复涂抹），
 * 比 ctx.strokeText 更像素、边缘不会糊成一片。
 */
function pixelTextOutline(g, text, x, y, fill, outline, thickness) {
  const t = Math.max(1, Math.round(thickness || 1));
  g.fillStyle = outline;
  for (let r = t; r >= 1; r--) {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        g.fillText(text, x + dx, y + dy);
      }
    }
  }
  g.fillStyle = fill;
  g.fillText(text, x, y);
}

/** 像素风文字：先画一层右下 1px 的暗色副本再画本体，压在背景图上也不会糊 */
function pixelText(g, text, cx, y, color) {
  g.fillStyle = THEME.shade;
  g.fillText(text, cx + 1, y + 1);
  g.fillStyle = color;
  g.fillText(text, cx, y);
}

/** 暂停界面：半透明遮罩 + 面板 +「退出游戏」按钮（继续 = 再按空格 / 点面板外的空白处） */
function renderPause(g) {
  const L = pauseLayout(), P = CONFIG.PAUSE, FONT = UI_FONT;
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = THEME.veil;
  g.fillRect(0, 0, W, H);

  const pn = L.panel;
  /* 只有「内部」半透明（后面的游戏画面透出来），外框照旧不透明、像素框不糊：
     先把内部底色按 PANEL_ALPHA 贴上，再把只剩外框的那一层不透明地盖上去 */
  blitAlpha(g, pn.x + 3, pn.y + 3, pn.w - 6, pn.h - 6, P.PANEL_ALPHA, function (bg) {
    pxRoundRect(bg, pn.x + 3, pn.y + 3, pn.w - 6, pn.h - 6, 4, THEME.panel);
    px(bg, pn.x + 7, pn.y + 3, pn.w - 14, 2, THEME.panelHi);
  });
  blitAlpha(g, pn.x - 6, pn.y - 6, pn.w + 12, pn.h + 12, 1, function (bg) {
    drawPixelPanelFrame(bg, pn.x, pn.y, pn.w, pn.h);
  });

  g.textAlign = 'center';
  g.font = 'bold 20px ' + FONT;
  pixelText(g, '暂停', W / 2, P.TITLE_Y, THEME.sand);

  for (let i = 0; i < L.buttons.length; i++) {
    const b = L.buttons[i];
    const over = input.rawX !== null && input.rawX >= b.x && input.rawX < b.x + b.w &&
                 input.rawY >= b.y && input.rawY < b.y + b.h;
    const rr = P.BTN_RADIUS || 4;
    const hi = over ? THEME.mint : THEME.line, body = over ? '#3b2a46' : THEME.panel;
    const bx = b.x, by = b.y, bw = b.w, bh = b.h;
    blitAlpha(g, bx, by, bw, bh, P.PANEL_ALPHA, function (bg) {        // 按钮内部：半透明
      pxRoundRect(bg, bx, by, bw, bh, rr, body);
    });
    blitAlpha(g, bx - 2, by - 2, bw + 4, bh + 4, 1, function (bg) {     // 按钮边框：不透明
      pxRoundRect(bg, bx - 2, by - 2, bw + 4, bh + 4, rr + 2, hi);
      punchInterior(bg, bx, by, bw, bh, rr);
    });
    g.font = 'bold ' + (P.BTN_FONT || 14) + 'px ' + FONT;
    g.fillStyle = over ? THEME.mint : THEME.ink;
    g.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 5);
  }
}

/** 暂停面板里那个唯一按钮的动作：退出游戏（回到开始界面） */
function pauseAction(id) {
  FAULT.run('操作·按键音', function () { Sound.playSfx('click'); });
  if (id === 'quit') {
    FAULT.run('操作·重开', function () { resetGame(); });
    GameState.mode = 'menu';    // 网页版无法可靠地关掉标签页，所以「退出游戏」= 回到开始界面
  }
}

/* =========================================================================
 * 侧栏按钮的像素图标 —— 静音（小喇叭）/ 暂停（双竖条）/ 继续（三角）
 * 画在右栏两颗 DOM 按钮里 16×12 的 <canvas> 上（CSS 放大 2 倍，保持像素锐利）。
 * ========================================================================= */
/** 像素小喇叭：(x,y) 是图标左上角，占 16×12。静音时右边改画一个珊瑚色叉 */
function drawSpeakerIcon(g, x, y, muted) {
  const c = muted ? THEME.inkDim : THEME.ink;
  px(g, x, y + 4, 3, 4, c);                 // 音箱本体
  px(g, x + 3, y + 3, 2, 6, c);             // 喇叭口：向右逐级张开
  px(g, x + 5, y + 2, 2, 8, c);
  px(g, x + 7, y, 2, 12, c);
  if (muted) {
    for (let i = 0; i < 5; i++) {           // 一个 2px 粗的叉
      px(g, x + 10 + i, y + 3 + i, 2, 2, THEME.coral);
      px(g, x + 14 - i, y + 3 + i, 2, 2, THEME.coral);
    }
  } else {
    px(g, x + 10, y + 4, 1, 4, c);          // 近处一圈声波
    px(g, x + 11, y + 3, 1, 1, c);
    px(g, x + 11, y + 8, 1, 1, c);
    px(g, x + 13, y + 3, 1, 6, c);          // 远处一圈声波
    px(g, x + 14, y + 2, 1, 1, c);
    px(g, x + 14, y + 9, 1, 1, c);
  }
}

/** 像素暂停图标：两根竖条（占 12×12） */
function drawPauseIcon(g, x, y) {
  px(g, x, y, 4, 12, THEME.ink);
  px(g, x + 8, y, 4, 12, THEME.ink);
}

/** 像素「继续」图标：向右的实心三角（占 11×12） */
function drawPlayIcon(g, x, y) {
  for (let i = 0; i < 12; i++) {
    const w = Math.round(10 * (1 - Math.abs(i - 5.5) / 5.5)) + 1;
    px(g, x, y + i, w, 1, THEME.mint);
  }
}

function renderMenu(g) {
  g.imageSmoothingEnabled = false;
  g.textAlign = 'center';

  // 标题右上角那行斜着的白描边警示语（★ 文案 / 位置 / 角度见 CONFIG.TITLE.WARN_*）
  const T = CONFIG.TITLE;
  if (T.WARN_TEXT && blinkOn()) {
    g.font = 'bold ' + T.WARN_SIZE + 'px ' + UI_FONT;
    g.save();
    g.translate(T.WARN_X, T.WARN_Y);                        // 以「文字基线中心」为旋转轴
    g.rotate(T.WARN_TILT * Math.PI / 180);
    pixelTextOutline(g, T.WARN_TEXT, 0, 0, THEME.coral, '#ffffff', T.WARN_OUTLINE);
    g.restore();
  }

  // 标题（像素 logo，整数倍放大，和左栏那张是同一张表）
  drawMenuTitle(g);

  // 角色展示（呼吸浮动 + 呼吸换帧，位置与游戏内一致：中心在 CENTER_Y_RATIO 那条线上）
  const P = CONFIG.PLAYER;
  const bob = Math.round(Math.sin(Player.bob) * P.BOB_AMP);
  drawPlayerFrameAt(g, Assets.player[playerFrameIndex()], W / 2 - P.W / 2, P.START_Y + bob);

  g.textAlign = 'center';

  if (blinkOn()) {
    g.font = 'bold 11px "Courier New",monospace';
    /* 提示句摆在角色下方（跟着站位走）：角色挪到屏幕下方 1/3 后，
       原先写死的 y 会被角色压住，所以由 START_Y + 角色高度反推 */
    pixelText(g, '按空格或点击开始', W / 2, P.START_Y + P.H + 22, THEME.sand);
  }
}

function renderGameOver(g) {
  g.fillStyle = THEME.veilEnd;
  g.fillRect(0, 0, W, H);
  g.textAlign = 'center';

  // 结算面板：和侧栏同款描边，只显示历史最好成绩。
  // 本局的分数 / 存活时间不在这里重复 —— 左侧栏（竖屏是顶栏）的 SCORE / TIME 一直是本局的数字，
  // 而竖屏侧栏已经不显示纪录栏了，所以「最高分 / 最长生存」只有这里能看
  const pw = 210, ph = 122, pxx = Math.round((W - pw) / 2), pyy = 156;
  drawPixelPanel(g, pxx, pyy, pw, ph);

  g.font = 'bold 26px "Courier New",monospace';
  pixelText(g, 'GAME OVER', W / 2, pyy + 42, THEME.coral);

  // 左右对齐的成绩四行：标签在左、数字在右，读起来更整齐。
  // 列间距按「带负号的 8 位数字」量出来（13px 等宽字体下约 70px），所以定在 COL_X = 78：
  // 标签右端到 W/2-18，数字左端最早到 W/2+8，中间稳留 26px，再长的分数也不会贴上标签
  const COL_X = 78;
  g.font = 'bold 13px "Courier New",monospace';
  g.fillStyle = THEME.inkDim;
  // 必须显式改回 left：上面画 GAME OVER 时设的是 center，
  // 不改的话标签会「以列中心居中」而不是左对齐，左边一半会捅出面板（实测左侧出框约 3px）
  g.textAlign = 'left';
  g.fillText('最高分', W / 2 - COL_X, pyy + 72);
  g.fillText('最长生存', W / 2 - COL_X, pyy + 96);
  g.textAlign = 'right';
  g.fillStyle = THEME.lilac;                     // 历史纪录：和侧栏 .value.record 同色
  g.fillText(UI.formatPlain(Records.score), W / 2 + COL_X, pyy + 72);
  g.fillText(Records.time.toFixed(1) + ' 秒', W / 2 + COL_X, pyy + 96);
  g.textAlign = 'center';

  if (blinkOn()) {
    g.font = 'bold 12px "Courier New",monospace';
    pixelText(g, '按空格 / 点击重开', W / 2, pyy + ph + 34, THEME.sand);
  }
}

/* =========================================================================
 * UI —— DOM 侧栏更新 + 按钮事件
 * ========================================================================= */
const UI = {
  scoreEl: document.getElementById('scoreValue'),
  timeEl: document.getElementById('timeValue'),
  barEl: document.getElementById('skillBar'),
  fillEl: document.getElementById('skillFill'),
  skillEl: document.getElementById('skillValue'),
  bestScoreEl: document.getElementById('bestScoreValue'),
  bestTimeEl: document.getElementById('bestTimeValue'),
  lastScore: null,
  lastTime: null,
  lastSkill: null,
  lastBestScore: null,
  lastBestTime: null,

  /* 右栏的「静音 / 暂停」按钮（原来是画布右上角的 HUD） */
  muteBtn: document.getElementById('muteBtn'),
  muteIcon: document.getElementById('muteIcon'),
  muteText: document.getElementById('muteText'),
  pauseBtn: document.getElementById('pauseBtn'),
  pauseIcon: document.getElementById('pauseIcon'),
  pauseText: document.getElementById('pauseText'),
  moveLeftBtn: document.getElementById('moveLeftBtn'),
  moveRightBtn: document.getElementById('moveRightBtn'),
  lastMuted: null,
  lastPaused: null,
  lastUsable: null,

  /** 重开时清空缓存，保证侧栏一定被强制刷新 */
  reset: function () {
    this.lastScore = null;
    this.lastTime = null;
    this.lastSkill = null;
  },

  /** 左下角实时 SCORE 用：补零到 CONFIG.SCORE_DIGITS 位，空位用 0 占位 */
  formatScore: function (n) {
    return (n < 0 ? '-' : '') + String(Math.abs(n)).padStart(CONFIG.SCORE_DIGITS, '0');
  },

  /** 历史和结算用：直接输出数字，不补空位 0（500 就显示 500，不显示 00000500） */
  formatPlain: function (n) {
    return String(n);
  },

  /**
   * 把分数写进侧栏数字框，并在放不下时降一档字号。
   * 补零后的 CONFIG.SCORE_DIGITS 位数字 18px 等宽字体宽约 86px，负号再加 11px；
   * 窄窗口下侧栏内容宽会缩到 ~91px，所以量一下实际宽度，超了就加 .tight（15px）。
   * 只在数字真的变化时调用，量宽度带来的重排可以忽略。
   */
  setValue: function (el, text) {
    el.classList.remove('tight');
    el.textContent = text;
    if (el.scrollWidth > el.clientWidth + 1) el.classList.add('tight');
  },

  /** 布局变化后重新量一次数字宽度：8 位分数带负号时要不要降字号，取决于数字框现在有多宽 */
  refitValues: function () {
    this.setValue(this.scoreEl, this.scoreEl.textContent);
    this.setValue(this.bestScoreEl, this.bestScoreEl.textContent);
  },

  syncScore: function (force) {
    if (this.lastScore === GameState.score && !force) return;
    this.lastScore = GameState.score;
    this.setValue(this.scoreEl, this.formatScore(GameState.score));
    this.scoreEl.classList.toggle('neg', GameState.score < 0);   // 负分时整块数字变红
    this.popEl(this.scoreEl);
  },

  /** 侧栏「历史纪录」：只在数值变化时写 DOM；pop=true 时最高分跳一下 */
  syncRecords: function (pop) {
    if (Records.score !== this.lastBestScore) {
      this.lastBestScore = Records.score;
      this.setValue(this.bestScoreEl, this.formatPlain(Records.score));
      if (pop) this.popEl(this.bestScoreEl);
    }
    // 最长生存不跳动：它每 0.1 秒就会刷新一次，跳起来会很吵
    const t = Records.time.toFixed(1) + ' s';
    if (t !== this.lastBestTime) {
      this.lastBestTime = t;
      this.bestTimeEl.textContent = t;
    }
  },

  /**
   * 绑定右栏两颗按钮。
   * pointerdown 里 preventDefault：既不让按钮抢走键盘焦点（否则之后按空格会变成「再次点击这个按钮」
   * 而不是暂停/开始游戏），也顺带阻止触摸时的滚动手势；真正的动作放在 click 上，
   * 这样键盘 Tab + 回车同样能用。stopPropagation 是为了不触发外层 #app 的「点侧栏 = 开始/继续游戏」。
   */
  bindSide: function () {
    const stop = function (e) { e.preventDefault(); e.stopPropagation(); };
    const self = this;
    this.muteBtn.addEventListener('pointerdown', stop);
    this.pauseBtn.addEventListener('pointerdown', stop);
    this.muteBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      FAULT.run('按钮·静音', function () { Sound.toggleMute(); });
      FAULT.run('按钮·静音图标', function () { self.syncSide(true); });
    });
    this.pauseBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (GameState.mode === 'playing' || GameState.mode === 'paused') primaryAction();
    });
  },

  /**
   * 绑定竖屏的左右移动键：按住 = 一直往那边走。
   * 做法是直接置 input.keyLeft / keyRight —— 和 ←/→、A/D 走的是同一条路径（见 Player.update），
   * 所以手感、加速度、边界完全一致，不用为按钮再写一套移动逻辑。
   * pointerdown 里把 input.aimX 清空：让角色从「自己当前位置」开始被推着走，
   * 而不是先瞬移到按钮所在的 x；同时 aimLock 挡住这期间的指针瞄准。
   */
  bindMove: function () {
    const self = this;
    [[this.moveLeftBtn, 'keyLeft'], [this.moveRightBtn, 'keyRight']].forEach(function (pair) {
      const btn = pair[0], key = pair[1];
      if (!btn) return;
      const press = function (e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }   // 别让这次按下顺手把角色瞄到按钮上
        input.aimLock = true;
        input.aimX = null;
        input[key] = true;
        btn.classList.add('on');
      };
      const release = function () {
        if (!input[key] && !input.aimLock) return;
        input[key] = false;
        input.aimLock = false;                                // 松手 → 指针瞄准恢复
        btn.classList.remove('on');
      };
      btn.addEventListener('pointerdown', press);
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', release);
      btn.addEventListener('pointerleave', release);         // 鼠标按住后移出按钮也要松手
      // 老浏览器兜底：没有 Pointer Events 时用 touch / mouse（有 PointerEvent 的完全不走这段）
      if (!window.PointerEvent) {
        btn.addEventListener('touchstart', press, { passive: false });
        btn.addEventListener('touchend', release);
        btn.addEventListener('touchcancel', release);
        btn.addEventListener('mousedown', press);
        btn.addEventListener('mouseup', release);
        btn.addEventListener('mouseleave', release);
      }
    });
  },

  /** 每帧调用：只在状态真的变了时才写 DOM / 重画图标，避免每帧都动 DOM */
  syncSide: function (force) {
    const muted = !!Sound.muted;
    const paused = GameState.mode === 'paused';
    const usable = GameState.mode === 'playing' || GameState.mode === 'paused';
    if (!force && muted === this.lastMuted && paused === this.lastPaused && usable === this.lastUsable) return;
    this.lastMuted = muted;
    this.lastPaused = paused;
    this.lastUsable = usable;

    this.muteText.textContent = muted ? '已静音' : '静音';
    this.muteBtn.classList.toggle('on', muted);
    this.muteBtn.title = (muted ? '取消静音' : '静音') + '（快捷键 M）';

    this.pauseText.textContent = paused ? '继续' : '暂停';
    this.pauseBtn.classList.toggle('on', paused);
    this.pauseBtn.classList.toggle('off', !usable);
    this.pauseBtn.title = (paused ? '继续游戏' : '暂停游戏') + '（空格）';

    this.drawSideIcons();
  },

  /** 重画两颗按钮里的像素图标（喇叭随静音状态换叉，暂停/继续随游戏状态换三角） */
  drawSideIcons: function () {
    const m = this.muteIcon.getContext('2d');
    m.imageSmoothingEnabled = false;
    m.clearRect(0, 0, this.muteIcon.width, this.muteIcon.height);
    drawSpeakerIcon(m, 0, 0, Sound.muted);              // 16×12，正好铺满图标画布

    const p = this.pauseIcon.getContext('2d');
    p.imageSmoothingEnabled = false;
    p.clearRect(0, 0, this.pauseIcon.width, this.pauseIcon.height);
    if (GameState.mode === 'paused') drawPlayIcon(p, 3, 0);   // 三角 11×12，居中留 3px
    else drawPauseIcon(p, 2, 0);                              // 双竖条 12×12，居中留 2px
  },

  popEl: function (el) {
    el.classList.remove('pop');
    void el.offsetWidth;   // 强制重排以重启动画
    el.classList.add('pop');
  },

  update: function () {
    // 侧栏的每一块都独立兜底：某一块坏了（DOM 被改、存储不可用…）不会连带其它块不更新
    const self = this;
    // 分数：addScore 只改内存，这里每帧统一刷一次（内部有「没变就不碰 DOM」的缓存）
    FAULT.run('侧栏·分数', function () { self.syncScore(false); });

    FAULT.run('侧栏·时间', function () {
      const t = GameState.elapsed.toFixed(1);
      if (t !== self.lastTime) {
        self.lastTime = t;
        self.timeEl.textContent = t;
      }
    });

    FAULT.run('侧栏·纪录', function () {
      // 历史纪录：本局分数/存活时间一超过纪录就立刻刷新并写盘
      if (Records.submit(GameState.score, GameState.elapsed)) self.syncRecords(true);
      // 不在进行中（菜单/暂停/死亡/结束）时把还没落盘的纪录补写：
      // 死亡那一帧的推进发生在 submit 之前，只靠死亡时的 flush 会漏掉最后一帧
      if (GameState.mode !== 'playing') Records.flush();
    });

    FAULT.run('侧栏·技能条', function () {
      const active = limeActive();
      const remain = active ? GameState.limeTimer : 0;
      const key = active ? Math.ceil(remain * 10) : -1;
      if (key === self.lastSkill) return;
      self.lastSkill = key;
      if (active) {
        self.fillEl.style.setProperty('--skill-pct', ((remain / CONFIG.LIME.DURATION) * 100).toFixed(1) + '%');
        self.skillEl.textContent = remain.toFixed(1) + ' s';
        self.skillEl.classList.add('on');
        self.barEl.classList.add('on');
      } else {
        self.fillEl.style.setProperty('--skill-pct', '0%');
        self.skillEl.textContent = '--';
        self.skillEl.classList.remove('on');
        self.barEl.classList.remove('on');
      }
    });

    // 静音 / 暂停按钮（内部有状态缓存，没变就不碰 DOM）
    FAULT.run('侧栏·按钮', function () { self.syncSide(); });
  },
};

/* ---- 键盘：仅作备用操作，按住时临时覆盖指针 ---- */
const HANDLED = ['KeyA', 'KeyD', 'ArrowLeft', 'ArrowRight', 'Space', 'KeyM', 'Escape'];
window.addEventListener('keydown', function (e) {
  if (HANDLED.indexOf(e.code) >= 0) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.keyLeft = true;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') input.keyRight = true;
  if (e.code === 'Space' || e.code === 'Escape') primaryAction();
  if (e.code === 'KeyM') {
    FAULT.run('快捷键·静音', function () { Sound.toggleMute(); });
    FAULT.run('快捷键·静音图标', function () { UI.syncSide(true); });
  }
});
window.addEventListener('keyup', function (e) {
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.keyLeft = false;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') input.keyRight = false;
});
window.addEventListener('blur', function () {
  input.keyLeft = input.keyRight = false;
});

/* ---- 空格 / 点击：开始 · 暂停 · 继续 · 重开 ---- */
function primaryAction() {
  // 按键音是附属效果，出问题不该影响状态切换
  FAULT.run('操作·按键音', function () { Sound.playSfx('click'); });
  if (GameState.mode === 'menu' || GameState.mode === 'gameover') {
    FAULT.run('操作·重开', function () { resetGame(); });
    GameState.mode = 'playing';
  } else if (GameState.mode === 'playing') {
    GameState.mode = 'paused';      // 游戏中按空格 = 暂停
  } else if (GameState.mode === 'paused') {
    GameState.mode = 'playing';     // 暂停时再按一次 = 继续
  }
}
canvas.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  const p = canvasPoint(e.clientX, e.clientY);
  if (GameState.mode === 'paused') {
    // 暂停时：点在「退出」按钮上 = 退出；点其它任何地方 = 继续游戏
    const id = p ? pauseButtonAt(p.x, p.y) : null;
    if (id) pauseAction(id); else primaryAction();
    return;
  }
  // 手机上「按住画面左右拖动」就是操作角色，所以游戏进行中不再拿点击当暂停（暂停请按右栏按钮）；
  // 开始 / 结算界面照样点一下就开，手机没有空格键，这是唯一入口
  if (e.pointerType === 'touch' && GameState.mode === 'playing') return;
  primaryAction();
});
document.getElementById('app').addEventListener('pointerdown', function (e) {
  if (e.target === canvas) return;      // 画布内另有处理（要先判断是不是点在按钮上）
  if (e.target.closest('.ctl')) return; // 右栏的静音 / 暂停按钮自己处理
  if (GameState.mode === 'menu' || GameState.mode === 'gameover' ||
      GameState.mode === 'paused') primaryAction();
});

/* ---- 布局自适应：宽屏三栏 / 窄屏（手机）上下堆叠 ----
   「三栏」＝ 左栏 + 画面 + 右栏，至少要 900px 宽才放得下，手机竖屏只能上下堆叠
   （样式见 CSS 里的 #app.mode-tall）：
     顶栏 = 分数 / 时间 / 食物提示   中间 = 游戏画面   底栏 = 静音 / 暂停 / 技能条 / 纪录
   画布按可用空间等比缩放（始终整数逻辑像素渲染，再交给 CSS 缩放）。 */

/** 可视区尺寸：手机地址栏收放时 innerHeight 不一定跟着变，
    visualViewport 才是「眼睛真能看到的那块」，有就优先用它 */
function viewportW() { return window.visualViewport ? window.visualViewport.width : window.innerWidth; }
function viewportH() { return window.visualViewport ? window.visualViewport.height : window.innerHeight; }

/** 三栏布局最少需要多宽：两个侧栏 + 画面（按当前高度能给出的缩放估算）+ 间距 */
function neededWideWidth() {
  const s = clamp((viewportH() - 44) / H, CONFIG.LAYOUT.MIN_SCALE, CONFIG.LAYOUT.MAX_SCALE);
  return 2 * clamp(96 + 40 * s, 118, 182) + W * s + CONFIG.LAYOUT.GAP * 2 + 20;
}

/** 该用哪种布局：'wide' = 左右三栏，'tall' = 上下堆叠（手机竖屏） */
function pickLayout() {
  if (viewportW() <= CONFIG.LAYOUT.TALL_MAX_W) return 'tall';
  return viewportW() < neededWideWidth() ? 'tall' : 'wide';
}

/**
 * 竖屏时把青柠效果条搬到顶栏（左栏），回到三栏布局再搬回右栏 —— 纯 CSS 做不到跨容器搬家。
 * 只在布局真的变了时才动 DOM：insertBefore 会触发重排，不能每帧都来一次。
 */
function placeSkill() {
  const box = document.getElementById('skillBox');
  if (!box) return;
  const tall = appEl.classList.contains('mode-tall');
  const left = appEl.querySelector('.left');
  const right = appEl.querySelector('.right');
  if (!left || !right) return;
  if (tall) {
    if (box.parentNode !== left) left.insertBefore(box, document.getElementById('legend'));
  } else if (box.parentNode !== right) {
    right.insertBefore(box, right.querySelector('.stats'));   // 回到「静音暂停」和纪录之间
  }
}

function fitLayout() {
  const L = CONFIG.LAYOUT;
  const mode = pickLayout();
  appEl.classList.toggle('mode-tall', mode === 'tall');
  placeSkill();
  appEl.classList.toggle('mode-compact', mode === 'tall' && viewportH() < L.COMPACT_MAX_H);
  appEl.classList.toggle('mode-short', mode === 'wide' && viewportH() < L.SHORT_MAX_H);

  let s;
  if (mode === 'tall') {
    /* 堆叠模式下画面占的是 flex:1 的那一格，所以直接量「这格还剩多少空间」——
       顶栏/底栏内容怎么变都不会溢出，比按固定留白估算靠谱得多 */
    const box = appEl.querySelector('.center');
    const cs = getComputedStyle(box);
    const availW = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const availH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    s = Math.min(availW / W, availH / H);
  } else {
    const availH = viewportH() - 44;
    const availW = viewportW() - 44;
    const panelGuess = clamp(96 + 44 * 1.4, 120, 180);
    s = Math.min(availH / H, (availW - panelGuess * 2 - 40) / W);
  }
  if (!(s > 0)) return;                     // 首帧 / 页面被隐藏时量不到尺寸，保持原样
  s = clamp(s, L.MIN_SCALE, L.MAX_SCALE);
  if (L.INTEGER_SCALE && s >= 1) s = Math.floor(s);   // 需要「像素绝对均匀」就把它打开

  canvas.style.width = Math.round(W * s) + 'px';
  canvas.style.height = Math.round(H * s) + 'px';
  document.documentElement.style.setProperty('--panel-w', Math.round(clamp(96 + 40 * s, 118, 182)) + 'px');
  UI.refitValues();     // 数字框宽度变了，重新决定 8 位分数要不要降一档字号（见 UI.setValue）
}
window.addEventListener('resize', fitLayout);
window.addEventListener('orientationchange', fitLayout);
/* 手机地址栏收放 / 键盘弹出会改变可视高度但不一定触发 resize，这里也跟一手 */
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fitLayout);
  window.visualViewport.addEventListener('scroll', fitLayout);
}

/* ---- 右栏「食物分值提示」：食物图标 + 分值 ----
   图标直接用原始 1× 精灵按整数倍放大，避免非整数缩放导致像素糊掉。
   分值从 CONFIG.FOOD 读取，所以改分值只需改 CONFIG，这里会自动跟着变。 */
function buildLegend() {
  const host = document.getElementById('legend');
  if (!host) return;
  host.innerHTML = '';

  const L = CONFIG.LEGEND;
  const rows = [];
  let slotW = 0;

  L.ORDER.forEach(function (key) {
    const food = CONFIG.FOOD[key], src = Assets.foodIcon[key];
    if (!food || !src) return;

    // 取能塞进 ICON_MAX_W×ICON_MAX_H 的最大整数倍（且不超过 ICON_MAX_SCALE）
    const k = clamp(Math.min(
      Math.floor(L.ICON_MAX_W / src.width),
      Math.floor(L.ICON_MAX_H / src.height),
      L.ICON_MAX_SCALE), 1, L.ICON_MAX_SCALE);

    const icon = sprite(src.width * k, src.height * k, function (g) {
      g.drawImage(src, 0, 0, src.width * k, src.height * k);
    });
    icon.title = food.name || key;
    if (icon.width > slotW) slotW = icon.width;

    const val = document.createElement('span');
    val.className = 'val ' + (food.score < 0 ? 'down' : 'up');
    val.textContent = (food.score > 0 ? '+' : '') + food.score;

    const row = document.createElement('div');
    row.className = 'row';
    row.appendChild(icon);
    row.appendChild(val);
    rows.push(row);
  });

  host.style.setProperty('--legend-icon-w', slotW + 'px');   // 图标槽宽取最宽图标 → 所有图标居中对齐
  rows.forEach(function (row) { host.appendChild(row); });
}

/**
 * 标签页图标：直接用游戏里现成的 greendu-normal 精灵（青柠状态的绿嘟，Assets.player[3]）
 * 转成 PNG data URI 塞进 <link rel="icon">，这样不用额外引入图标文件，也和游戏里长得一模一样。
 * 精灵本身是像素画，浏览器会自己缩到 16×16 显示。
 */
function buildFavicon() {
  const el = document.getElementById('favicon');
  const src = Assets.player[3];      // 3 = 青柠 · 呼吸 A（greendu-normal 原色），见 buildAssets 的 combos
  if (!el || !src) return;
  try {
    el.href = src.toDataURL('image/png');
  } catch (e) { /* 个别浏览器不允许 canvas 转 dataURL，失败就保持默认图标，不影响游戏 */ }
}

/** 右栏技能框顶部的青柠 logo：拿左栏 legend 同款的小号青柠图标整数倍放大后画进容器 */
function buildSkillIcon() {
  const host = document.getElementById('skillLogo');
  if (!host) return;
  const src = Assets.foodIcon.lime;
  if (!src) return;
  host.innerHTML = '';

  const k = Math.max(1, Math.round(CONFIG.SKILL_LOGO.SCALE));   // 只接受整数倍，避免像素被拉伸糊掉
  const icon = sprite(src.width * k, src.height * k, function (g) {
    g.imageSmoothingEnabled = false;
    g.drawImage(src, 0, 0, src.width * k, src.height * k);
  });
  // 原来那四个字被换掉了，这里补上语义/提示，鼠标悬停仍能看到「青柠效果」
  icon.title = '青柠效果';
  icon.setAttribute('role', 'img');
  icon.setAttribute('aria-label', '青柠效果');
  host.appendChild(icon);
  /* 容器预留高度 = 图标实际高度：换 SKILL_LOGO.SCALE 时行高跟着变，不会在下方留空档
     （竖屏下 logo 会被 CSS 收掉，写死也不影响） */
  host.style.minHeight = icon.height + 'px';
}

/* 准备界面用的精细版标题像素表：同一张 images/title.png，按 128×34 的格子提取
   （左栏那张 TITLE_SPRITE 是 64×17 的粗版；这张 ×2 倍 = 256×68，字形清楚得多）

/** 把一张标题像素表按整数倍画到画布上（逐格 fillRect，像素绝对锐利） */
function drawTitleSprite(g, T, x, y, k) {
  const C = {};
  for (let i = 0; i < T.pal.length; i++) C[FOOD_CHARS.charAt(i)] = T.pal[i];
  for (let j = 0; j < T.rows.length; j++) {
    const row = T.rows[j];
    for (let i = 0; i < row.length; i++) {
      const col = C[row[i]];
      if (col) px(g, x + i * k, y + j * k, k, k, col);
    }
  }
}

/** 开始界面的标题：用精细版表（128×34），水平居中 + 一层硬投影（压在背景图上不会糊成一片） */
function drawMenuTitle(g) {
  const T = CONFIG.TITLE, k = Math.max(1, Math.round(T.MENU_SCALE));
  const tw = TITLE_SPRITE_BIG.rows[0].length * k;
  const x = Math.round((W - tw) / 2), y = Math.round(T.MENU_Y);
  g.save();
  g.shadowColor = 'rgba(6,3,10,0.85)';
  g.shadowOffsetX = 0;
  g.shadowOffsetY = 3;
  g.shadowBlur = 0;
  drawTitleSprite(g, TITLE_SPRITE_BIG, x, y, k);
  g.restore();
}

/* ---- 左栏像素风标题：直接把 TITLE_SPRITE 逐格画出来，再按整数倍放大（像素才不糊） ---- */
function buildTitle() {
  const T = TITLE_SPRITE;
  const w = T.rows[0].length, h = T.rows.length;
  const k = Math.max(1, Math.round(CONFIG.TITLE.DOM_SCALE));

  const el = document.getElementById('titleCanvas');
  el.width = w; el.height = h;
  const g = el.getContext('2d');
  g.imageSmoothingEnabled = false;
  drawPixelTable(g, T);

  el.style.width = (w * k) + 'px';      // 整数倍放大：CSS 的 pixelated 不会产生半像素
  el.style.height = (h * k) + 'px';
  Assets.title = el;
}

/* =========================================================================
 * 主循环 —— requestAnimationFrame + 固定时间步长
 * ========================================================================= */
let acc = 0;
let last = 0;
let framesRendered = 0;    // 已经画出来的帧数：启动兜底和「是否真的跑起来了」都看它
let frameErrors = 0;       // 主循环里出错过的次数（只记前几次，避免刷爆控制台）

function frame(now) {
  requestAnimationFrame(frame);   // 先把下一帧排上：本帧就算出错，循环也不会断
  framesRendered++;
  try {
    tick(now);
  } catch (e) {
    /* 单帧出错不该把整个游戏冻住（手机上偶尔会撞到画布 / 音频的兼容问题）。
       以前这里没有兜底：一旦某帧抛异常，后面的 render 永远不执行，
       画面就停在「只有背景」的样子，看起来像是卡死了。 */
    if (frameErrors < 3) {
      frameErrors++;
      if (window.console && console.error) {
        console.error('[咕嘟咕噜兽] 主循环出错（第 ' + frameErrors + ' 次），已跳过该帧：', e);
      }
    }
  }
}

/* 固定时间步长推进 + 渲染（真正干活的函数，由 frame() 包着 try/catch 调用） */
function tick(now) {
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > CONFIG.MAX_FRAME_DT) dt = CONFIG.MAX_FRAME_DT;

  acc += dt;
  let steps = 0;
  while (acc >= CONFIG.FIXED_DT && steps < CONFIG.MAX_STEPS) {
    // 逻辑更新在这里兜底；acc 的扣减放在 try 之外，逻辑出错也不会让累加器失控
    FAULT.run('主循环·逻辑', function () { update(CONFIG.FIXED_DT); });
    acc -= CONFIG.FIXED_DT;
    steps++;
  }
  if (steps >= CONFIG.MAX_STEPS) acc = 0;

  // 下面三件事互不依赖：音乐坏了不影响画面，侧栏坏了也不影响画面
  FAULT.run('主循环·背景音乐', function () { Sound.applyBgm(GameState.mode); });
  FAULT.run('主循环·画面', function () { render(); });
  FAULT.run('主循环·侧栏', function () { UI.update(); });
}

document.addEventListener('visibilitychange', function () {
  if (document.hidden) Records.flush();            // 切后台时把纪录写盘
  else { last = 0; acc = 0; }
});
window.addEventListener('beforeunload', function () { Records.flush(); });

/* =========================================================================
 * 音频 —— 背景音乐 + 音效（外部文件清单）
 *
 * 音频都放在 music/ 目录里，本清单把「游戏里的键」映射到「文件名」，
 * 拼接用的目录前缀见 CONFIG.AUDIO.DIR，改路径只需要改这两处。
 * 文件名 → 用途：
 *   openning.mp3                                          准备界面循环曲
 *   playing.mp3                                           游戏界面循环曲（循环播放）
 *   eatfoods.mp3 / lemon.mp3 / eatshit.mp3
 *   bingbingbing.mp3 / click.mp3 / die.mp3
 *   bubble.mp3 / broken.mp3                                八种音效
 *
 * ⚠️ 用 file:// 直接双击打开时，Chrome 系浏览器拒绝加载 ≥32 KiB 的本地音频
 *   （实测同一批文件里 25,754 B 的 bingbingbing.mp3 能加载，32,768 B 就不行，报
 *    MEDIA_ELEMENT_ERROR / net::ERR_ABORTED；把 25 KB 的文件补到 75 KB 也会失败，
 *    所以是「体积门槛」而不是编码问题）。八个音效都 ≤25.8 KB，双击时正常出声；
 *    两首 BGM 都远超 32 KiB，双击时没声音但游戏照常能玩 —— 音频加载失败由容错层
 *    兜住，不影响启动。想让背景音乐也出声，请用本地服务器打开，在本目录执行：
 *       python -m http.server 8000
 *   然后浏览器访问 http://localhost:8000/
 * ========================================================================= */
const AUDIO_FILES = {
  bgm: {
    menu: 'openning.mp3',                      // 准备界面循环曲
    play: 'playing.mp3',                       // 游戏界面循环曲（循环播放，靠 ensureBgm 里的 a.loop = true）
  },
  sfx: {
    eat:   'eatfoods.mp3',   // 吃到潜水艇 / 薯条
    lemon: 'lemon.mp3',         // 吃到青柠
    shit:  'eatshit.mp3',       // 吃到狗屎
    bing:  'bingbingbing.mp3',  // 吃到冰淇淋（青柠效果期间由狗屎变来）
    click: 'click.mp3',      // 按键 / 开始 / 暂停
    die:   'die.mp3',           // 死亡
    bubble:'bubble.mp3',        // 撞泡触发爆炸（青柠无敌期那一下）
    broken:'broken.mp3',        // 爆炸炸碎堆积物 / 炸掉下落食物
  },
};

/** 每个音频文件的缓存戳（形如 '?v=1759…'），由 Sound.probeCache() 填；开关见 CONFIG.AUDIO.STAMP */
const AUDIO_STAMP = {};

/** 文件名 → 可用的音频 URL（目录前缀见 CONFIG.AUDIO.DIR，缓存戳见 CONFIG.AUDIO.STAMP） */
function audioUrl(name) {
  return CONFIG.AUDIO.DIR + name + (AUDIO_STAMP[name] || '');
}

const Sound = {
  ok: false,        // 音频系统是否可用
  muted: false,     // 静音开关（右栏小喇叭按钮 / M 键；只在本局有效，刷新后恢复有声）
  unlocked: false,  // 是否已经拿到用户手势（没有手势浏览器不让出声）
  cur: null,        // 当前 BGM：'menu' | 'play'
  lastMode: null,   // 上一帧的界面状态：用来识别「重新开了一局」
  bgm: {},          // BGM 元素（按需创建，见 ensureBgm）
  pool: {},         // 音效池 { 键: [元素…] }（按需创建，见 ensurePool）
  idx: {},          // 音效池的轮换下标
  bgmBroken: {},    // 建不出来的曲子，记下来不再重试
  poolBroken: {},   // 建不出来的音效，记下来不再重试
  ctx: null,        // 需要额外增益时才创建的 AudioContext
  gain: {},         // { 键: GainNode }
  pending: null,    // 被自动播放策略拦下的那次音效，等手势后补播
  booted: false,    // 是否已经真正开始建元素（缓存戳没探回来之前不建，见 init/probeCache）

  /**
   * 启动音频系统。这里只做「最必要」的事，剩下的一律按需创建：
   *
   * 原来是在启动时一次性 new 出 20 个 <audio>，每个都挂着 base64 地址，其中游戏曲那一条
   * data URI 就有 11.7MB。手机上这会同时踩三个坑：
   *   · 主线程要同步做 base64 解码 + 分配 8.8MB 解码缓冲，启动会被卡住好几秒；
   *   · 手机浏览器对「同时打开的媒体元素数量」有上限（iOS 历史上是 16 个），20 个会被拒；
   *   · 低端机内存不够时整页可能被系统回收。
   * 而这些都发生在 requestAnimationFrame(frame) **之前** —— 一旦抛异常，主循环就永远不会启动，
   * 表现就是「卡在背景、点不动、进不去游戏」。
   *
   * 现在改成：准备界面那首曲子（约 400KB）立刻建，保证一进来就有音乐；
   * 游戏曲（8.6MB）等真的进游戏时再建；音效池等第一帧画完、浏览器空闲时再建。
   */
  init: function () {
    const A = CONFIG.AUDIO;
    if (!A.ENABLED || typeof Audio !== 'function') return;
    Sound.ok = true;
    document.addEventListener('pointerdown', Sound.unlock, true);
    document.addEventListener('keydown', Sound.unlock, true);
    // 建元素之前先把缓存戳探回来（一般几毫秒）；环境不配合时 1.6s 兜底，绝不挡主循环
    const boot = function () {
      if (Sound.booted) return;
      Sound.booted = true;
      Sound.ensureBgm(Sound.keyOf(GameState.mode));  // 轻量那条，立刻可用
      Sound.applyBgm(GameState.mode);                // 先试一次；没手势会被浏览器拦下，unlock 时再补
      Sound.warmUp();                                // 空闲时把音效池建起来，绝不挡启动
    };
    if (!FAULT.run('音频·缓存戳', function () { return Sound.probeCache(boot); })) boot();
    setTimeout(function () { FAULT.run('音频·缓存戳兜底', boot); }, 1600);
  },

  /**
   * 探测每个音频文件的 Last-Modified，拼成 ?v=… 缓存戳。为什么非做不可：
   * 本机服务器（python -m http.server）只发 Last-Modified、不发 Cache-Control，浏览器就按
   * 「启发式新鲜度」（约等于文件年龄的 10%）直接吃缓存不回源。于是「换掉 music/ 里的文件」
   * 这种最自然的改法反而不生效：实测 eatshit.mp3 换成新内容后，元素拿到的还是旧字节，
   * 硬刷新也照样是旧的。加戳之后文件改了 URL 就变、必然回源，没改则 URL 不变、缓存照旧。
   * 只在 http(s) 下加戳（file:// 带 query 取不到文件，那边本来还有 32KiB 体积门槛）。
   * 返回 false = 不用等探测，调用方立刻继续。
   */
  probeCache: function (done) {
    if (!CONFIG.AUDIO.STAMP || !/^https?:$/.test(location.protocol) || !window.fetch) return false;
    const files = [];
    for (const k in AUDIO_FILES.bgm) files.push(AUDIO_FILES.bgm[k]);
    for (const k in AUDIO_FILES.sfx) files.push(AUDIO_FILES.sfx[k]);
    if (!files.length) return false;
    let left = files.length;
    const step = function () { if (--left <= 0) done(); };
    files.forEach(function (f) {
      const p = FAULT.run('音频·缓存戳', function () {
        return fetch(audioUrl(f), { method: 'HEAD', cache: 'no-store' }).then(function (r) {
          const lm = r.headers.get('Last-Modified');
          const t = lm ? Date.parse(lm) : NaN;
          if (t === t) AUDIO_STAMP[f] = '?v=' + t;
        }).catch(function () { /* 探测失败就不加戳，音频照常按原 URL 加载 */ });
      }, null);
      if (p && p.then) p.then(step); else step();
    });
    return true;
  },

  /** 当前界面该放哪首 BGM */
  keyOf: function (mode) { return mode === 'menu' ? 'menu' : 'play'; },

  /** 空闲时预热音效池；建不出来的当场记住，真要播的时候也不会再拖慢画面 */
  warmUp: function () {
    const go = function () {
      for (const k in AUDIO_FILES.sfx) Sound.ensurePool(k);
    };
    if (window.requestIdleCallback) window.requestIdleCallback(go, { timeout: 3000 });
    else window.setTimeout(go, 400);
  },

  /** 音频加载失败时给一条能看懂的提示：多半是用 file:// 打开造成的（见文件顶部说明） */
  watchLoad: function (a, file) {
    a.addEventListener('error', function () {
      FAULT.report('音频文件', new Error(
        '加载失败：' + audioUrl(file) +
        '（若你是双击 HTML 打开的，请改用本地服务器：在本目录执行 python -m http.server 8000）'));
    });
  },

  /** 按需建一首 BGM（建过/建失败过都直接返回） */
  ensureBgm: function (key) {
    if (Sound.bgm[key] || Sound.bgmBroken[key]) return Sound.bgm[key] || null;
    const file = AUDIO_FILES.bgm[key];
    if (!file) return null;
    try {
      const a = new Audio(audioUrl(file));
      Sound.watchLoad(a, file);
      a.loop = true;
      a.preload = 'auto';
      a.volume = CONFIG.AUDIO.BGM_VOLUME;
      Sound.bgm[key] = a;
    } catch (e) {
      Sound.bgmBroken[key] = true;                 // 这首放不出来了，但游戏照常跑
      if (window.console && console.warn) console.warn('[咕嘟咕噜兽] 背景音乐创建失败：', key, e);
    }
    return Sound.bgm[key] || null;
  },

  /** 按需建某个音效的池（SFX_POOL 个副本轮着用，连着吃同一种食物时声音不会互相打断） */
  ensurePool: function (key) {
    if (!Sound.booted) return null;              // 缓存戳还没探回来，等 boot 里的 warmUp 再建
    if (Sound.pool[key] || Sound.poolBroken[key]) return Sound.pool[key] || null;
    const file = AUDIO_FILES.sfx[key];
    if (!file) return null;
    const A = CONFIG.AUDIO, arr = [];
    try {
      for (let i = 0; i < A.SFX_POOL; i++) {
        const a = new Audio(audioUrl(file));
        Sound.watchLoad(a, file);
        a.preload = 'auto';
        a.volume = A.SFX_VOLUME[key] === undefined ? A.SFX_VOLUME.default : A.SFX_VOLUME[key];
        arr.push(a);
      }
      Sound.pool[key] = arr;
      Sound.idx[key] = 0;
      Sound.ensureGain(key);                       // 这个音效要额外增益的话，池建好就接上
    } catch (e) {
      Sound.poolBroken[key] = true;
      if (window.console && console.warn) console.warn('[咕嘟咕噜兽] 音效创建失败：', key, e);
      return null;
    }
    return arr;
  },

  /** 第一次点击/按键：解锁音频；若刚才有音效被拦下，补播它 */
  unlock: function () {
    if (Sound.unlocked) return;
    Sound.unlocked = true;
    if (Sound.ctx && Sound.ctx.state !== 'running') Sound.ctx.resume();
    Sound.applyBgm(GameState.mode);
    if (Sound.pending) { const k = Sound.pending; Sound.pending = null; Sound.playSfx(k); }
  },

  /**
   * 给音量不够的音效接上增益节点。
   * element.volume 上限是 1.0，所以比 1.0 更响的只能走 Web Audio：
   * 元素 → MediaElementSource → GainNode → 输出。没写进 SFX_GAIN 的音效完全不碰，
   * 保持原生播放；建不出 AudioContext 的老浏览器会退化成「只靠 volume」，声音偏小但不会报错。
   */
  ensureGain: function (key) {
    if (!(CONFIG.AUDIO.SFX_GAIN[key] > 1)) return;      // 不需要额外增益的完全不碰
    if (Sound.gain[key] !== undefined) return;          // 已经接好（或试过并放弃）
    const arr = Sound.pool[key];
    if (!arr) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { Sound.gain[key] = 0; return; }          // 老浏览器退化成「只靠 volume」
    try {
      if (!Sound.ctx) Sound.ctx = new Ctx();
      const g = Sound.ctx.createGain();
      g.gain.value = CONFIG.AUDIO.SFX_GAIN[key];
      g.connect(Sound.ctx.destination);
      for (const a of arr) Sound.ctx.createMediaElementSource(a).connect(g);
      Sound.gain[key] = g;
    } catch (e) {
      Sound.gain[key] = 0;       // 0 = 试过了没接上，不再重试；声音偏小但不会报错
    }
  },

  /** 静音开关：BGM 靠 applyBgm 每帧同步（会立刻停下 / 恢复），音效直接在 playSfx 里拦掉 */
  setMuted: function (on) {
    Sound.muted = !!on;
    Sound.applyBgm(GameState.mode);
  },

  /** 静音开关翻转（右栏小喇叭按钮 / M 键） */
  toggleMute: function () {
    Sound.setMuted(!Sound.muted);
  },

  /** 播放音效：从池里轮一个出来，从头播 */
  playSfx: function (key) {
    if (!Sound.ok || Sound.muted) return;
    const arr = Sound.pool[key] || Sound.ensurePool(key);   // 预热还没跑到的就现建
    if (!arr) return;
    const i = Sound.idx[key] = (Sound.idx[key] + 1) % arr.length;
    const a = arr[i];
    try { a.currentTime = 0; } catch (e) { /* 还没解码完，直接从头播即可 */ }
    const p = a.play();
    if (p && p.catch) p.catch(function () { Sound.pending = key; });
  },

  /** 按当前界面切换 BGM：准备界面 = openning.mp3，其它（游戏/暂停/结束）= playing.mp3；暂停时不出声 */
  /**
   * 按当前界面切换 / 播放 BGM。
   * 只有这两种情况会「从头开始播放」，其余一律接着放：
   *   · 换曲子：主界面 openning ↔ 游戏曲 —— 也就是「退出到主界面 / 进入游戏」
   *   · 从主界面、结算界面重新开一局 —— 游戏曲也从头
   * 暂停 → 继续、静音 → 取消静音都保留进度，不会重头放。
   */
  applyBgm: function (mode) {
    if (!Sound.ok) return;
    if (!Sound.booted) return;      // 缓存戳还没探回来，先别建元素（主循环每帧都会再叫一次）
    const key = Sound.keyOf(mode);
    const prev = Sound.lastMode;
    Sound.lastMode = mode;

    if (key !== Sound.cur) {
      const old = Sound.bgm[Sound.cur];
      if (old) { old.pause(); Sound.rewind(old); }   // 旧曲子停住并归零，下次再进这个界面仍是从头
      Sound.cur = key;
      Sound.rewind(Sound.ensureBgm(key));            // 游戏曲第一次用到时才建（8.6MB，建出来偏慢）
    } else if (mode === 'playing' && prev !== 'playing' && prev !== 'paused') {
      Sound.rewind(Sound.bgm[key]);                  // 重新开一局：游戏曲从头
    }

    const a = Sound.bgm[Sound.cur];
    if (!a) return;
    if (Sound.muted || mode === 'paused') { if (!a.paused) a.pause(); return; }
    if (a.paused) {
      const p = a.play();
      if (p && p.catch) p.catch(function () { /* 等用户手势 */ });
    }
  },

  /** 把音频倒回开头（元数据还没到位时设置 currentTime 会抛错，忽略即可） */
  rewind: function (a) {
    if (!a) return;
    try { a.currentTime = 0; } catch (e) { /* 还没加载完，播的时候本来就是从头 */ }
  },
};

/* =========================================================================
 * 启动
 * ========================================================================= */
/**
 * 启动的每一步都单独隔离。
 *
 * 原来这里是一串线性调用，而 requestAnimationFrame(frame) 排在最后一行 ——
 * 手机上只要任何一步抛异常（最容易出问题的是音频初始化：要同步解码 12MB 的 base64、
 * 还会撞上手机浏览器对并发媒体元素数量的上限），整段启动就直接中断，
 * 主循环永远不会启动，画面就只剩背景、怎么点都没反应。
 * 现在把可选功能都包起来：坏一个就跳过它，游戏照常能玩。
 */
/** 启动步骤：直接复用容错层（同一个名字出错次数过多也会被停用，避免重复拖慢启动） */
function bootStep(name, fn) {
  return FAULT.run('启动·' + name, fn);
}

bootStep('绘制资源', function () { buildAssets(W, H); });
bootStep('堆积层', function () { StackSystem.init(); });
bootStep('本地纪录', function () { Records.load(); });
bootStep('食物提示', function () { buildLegend(); });
bootStep('技能图标', function () { buildSkillIcon(); });
bootStep('侧栏按钮', function () { UI.bindSide(); UI.bindMove(); UI.syncSide(true); });
bootStep('纪录显示', function () { UI.syncRecords(false); });
bootStep('标题', function () { buildTitle(); });
bootStep('标签图标', function () { buildFavicon(); });

/* 这几步是「游戏能跑起来」的最小集合，不该失败；真失败了由外层兜底画面 */
Player.reset();
Spawner.reset();
UI.syncScore(true);
fitLayout();

bootStep('音频', function () { Sound.init(); });   // 放最后：最重、最可能被手机浏览器拒绝

requestAnimationFrame(frame);

/* 兜底：1.5 秒后如果一帧都没画出来（rAF 被拦、脚本半路中断、内容还没渲染等），
   直接同步画一帧并把循环重新拉起来 —— 保证用户一定看得到画面，而不是一片空白 */
window.setTimeout(function () {
  if (framesRendered) return;
  FAULT.run('兜底渲染', render);   // 连渲染都失败也认了，至少把错误留个记录
  requestAnimationFrame(frame);
}, 1500);

})();
</script>
</body>
</html>
