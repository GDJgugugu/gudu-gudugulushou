<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>咕嘟咕噜兽</title>
<link rel="icon" id="favicon" type="image/png">
<style>
:root{
  --panel-w: 176px;

  /* ── 界面配色：整页皮肤都在这一段 ──
     颜色全部取自内嵌的背景图（上半是紫红珊瑚 #935578 / #8d3e67，下半是青绿海水 #5b9385），
     所以侧栏和游戏画面是一套色系。
     画布里的开始 / 暂停 / 结束界面也会读这些变量（见 JS 里的 THEME），
     改这里就能同时换掉 DOM 侧栏和画布内界面的配色。 */
  --ui-bg-top:   #2b1832;   /* 页面底色·上（紫红） */
  --ui-bg-mid:   #1c1526;   /* 页面底色·中 */
  --ui-bg-bot:   #0c2422;   /* 页面底色·下（青绿） */
  --ui-panel-hi: #33233c;   /* 面板高光 */
  --ui-panel-bg: #251a2c;   /* 面板底色 */
  --ui-box-bg:   #1b1220;   /* 面板内小框底色 */
  --ui-line:     #7c4a69;   /* 主描边（紫红） */
  --ui-line-dim: #4b2b40;   /* 次级描边 */
  --ui-outline:  #0c0710;   /* 最外圈黑描边 */
  --ui-ink:      #f4e7ef;   /* 主文字 */
  --ui-ink-dim:  #ad90a9;   /* 标签 / 次要文字 */
  --ui-mint:     #8fe0bd;   /* 加分、青柠技能（取背景图的水色） */
  --ui-coral:    #ff8492;   /* 扣分、危险 */
  --ui-sand:     #f6c98a;   /* 时间 */
  --ui-lilac:    #cdb4e8;   /* 历史纪录 */

  /* 旧变量名保留成别名，避免有漏改的地方突然花掉 */
  --ink: var(--ui-ink);
  --ink-dim: var(--ui-ink-dim);
  --line: var(--ui-line-dim);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
/* 手机浏览器地址栏收放会改变「能看见的高度」：dvh 会跟着变，而 100% 是按初始高度算的，
   所以这里用 dvh 兜一层，避免底部按钮被地址栏压住。不支持 dvh 的老浏览器继续用 100% */
@supports (height:100dvh){ body{ height:100dvh; } }
body{
  background:var(--ui-bg-mid);
  background-image:
    radial-gradient(135% 62% at 50% -8%, rgba(168,103,141,.55) 0%, rgba(28,21,38,0) 68%),
    linear-gradient(180deg, var(--ui-bg-top) 0%, var(--ui-bg-mid) 46%, var(--ui-bg-bot) 100%);
  background-attachment:fixed;
  color:var(--ui-ink);
  font-family:"Courier New",Consolas,monospace;
  overflow:hidden;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;              /* 关掉浏览器自己的滚动/缩放手势，画面上的拖动全部交给游戏 */
  overscroll-behavior:none;       /* 安卓上防止「下拉刷新」把游戏拉走 */
}
/* 页面底色上再叠一层 4px 的暗格：背景本身也有像素画的颗粒感（只在面板背后，不盖界面） */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    repeating-linear-gradient(90deg, rgba(6,3,8,.22) 0 2px, rgba(6,3,8,0) 2px 4px),
    repeating-linear-gradient(0deg,  rgba(6,3,8,.22) 0 2px, rgba(6,3,8,0) 2px 4px);
}
#app{
  position:relative; z-index:1;
  height:100%;
  display:flex; align-items:center; justify-content:center;
  gap:12px;
  /* 留白顺手避开刘海 / 底部横条（桌面端 env() 全为 0，等于原来的 10px） */
  padding:calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right))
          calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
}

/* ---------- 像素风面板：外黑框 → 中描边 → 主描边，顶部 2px 高光、底部 3px 阴影 ---------- */
.panel{
  background:linear-gradient(180deg, rgba(51,35,60,.95) 0%, rgba(37,26,44,.95) 58%, rgba(31,22,38,.95) 100%);
  border:3px solid var(--ui-line);
  box-shadow:
    0 0 0 3px var(--ui-outline),
    inset 0 2px 0 rgba(255,255,255,.075),
    inset 0 -3px 0 rgba(0,0,0,.38),
    0 12px 26px rgba(6,3,10,.62);
  border-radius:12px;      /* 圆角：最外圈黑描边会自动跟着变成 15px 的圆弧 */
}
.side{
  width:var(--panel-w); padding:12px; min-height:260px;
  display:flex; flex-direction:column; gap:12px;
}
.left{ justify-content:space-between; }
.right{ justify-content:space-between; }
.center{ padding:6px; }
#game{
  display:block; image-rendering:crisp-edges; image-rendering:pixelated; cursor:crosshair;
  touch-action:none;      /* 画面上的触摸全部交给游戏处理，不要触发滚动/缩放 */
  box-shadow:0 0 0 2px var(--ui-outline);
  border-radius:8px;      /* 画面四角跟着裁圆；不喜欢就把这一行删掉，游戏逻辑不受影响 */
}

/* ---------- 左栏 ---------- */
.title-wrap{ display:flex; justify-content:center; padding:6px 0; }
#titleCanvas{
  width:128px; height:34px;         /* = TITLE_SPRITE 表尺寸(64×17) × CONFIG.TITLE.DOM_SCALE(2) */
  image-rendering:crisp-edges; image-rendering:pixelated;
  max-width:100%;
  filter:drop-shadow(0 2px 0 rgba(6,3,10,.9)) drop-shadow(0 0 7px rgba(168,103,141,.6));
}
.box{
  background:linear-gradient(180deg, #261831 0%, var(--ui-box-bg) 100%);
  border:3px solid var(--ui-line-dim);
  box-shadow:0 0 0 2px var(--ui-outline), inset 0 2px 0 rgba(255,255,255,.05), inset 0 -2px 0 rgba(0,0,0,.42);
  border-radius:10px;
  padding:8px 6px; text-align:center;
}
.box.mb{ margin-bottom:12px; }      /* 上下两个数字框之间的间距（原来是 inline style） */
.box .label{ font-size:10px; letter-spacing:2px; color:var(--ui-ink-dim); margin-bottom:4px; }
.box .value{ font-size:18px; font-weight:700; line-height:1.1; white-space:nowrap; }
/* 位数太多时（8 位数字再加负号 = 9 字符 ≈ 97px，窄窗口下侧栏只有 91px）
   由 UI.fitValue() 自动降一档字号，避免顶破边框或悄悄折行 */
.box .value.tight{ font-size:15px; }
/* 数字统一带一层右下 2px 的硬投影：像素风的立体感 */
#scoreValue{ color:var(--ui-mint); text-shadow:0 0 8px rgba(143,224,189,.32), 0 2px 0 rgba(6,3,10,.8); }
#scoreValue.neg{ color:var(--ui-coral); text-shadow:0 0 10px rgba(255,132,146,.45), 0 2px 0 rgba(6,3,10,.8); }   /* 负分变红 */
#timeValue{ color:var(--ui-sand); text-shadow:0 0 8px rgba(246,201,138,.3), 0 2px 0 rgba(6,3,10,.8); }
.value.record{ color:var(--ui-lilac); text-shadow:0 0 8px rgba(205,180,232,.32), 0 2px 0 rgba(6,3,10,.8); white-space:nowrap; }  /* 历史纪录 */
.pop{ animation:pop .24s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop{ 0%{transform:scale(1)} 40%{transform:scale(1.38)} 100%{transform:scale(1)} }

/* ---------- 食物分值提示（图标 + 分值） ---------- */
.legend{
  background:linear-gradient(180deg, #261831 0%, var(--ui-box-bg) 100%);
  border:3px solid var(--ui-line-dim);
  box-shadow:0 0 0 2px var(--ui-outline), inset 0 2px 0 rgba(255,255,255,.05), inset 0 -2px 0 rgba(0,0,0,.42);
  border-radius:10px;
  padding:7px 6px; display:flex; flex-direction:column; gap:4px;
}
/* 图标槽宽 = 最宽图标（JS 写入 --legend-icon-w），因此所有图标共享同一条竖直中轴；
   整行用 justify-content:center 居中，行内宽度一致，看起来就是居中一列图标 */
.legend .row{
  display:grid;
  grid-template-columns:var(--legend-icon-w,32px) minmax(30px,auto);
  column-gap:5px; justify-content:center; align-items:center;
  min-height:26px;
}
.legend .row canvas{
  display:block; justify-self:center;
  image-rendering:crisp-edges; image-rendering:pixelated;
}
.legend .row .val{ justify-self:start; font-size:12px; font-weight:700; white-space:nowrap; }
.legend .row .val.up{ color:var(--ui-mint); text-shadow:0 0 7px rgba(143,224,189,.32), 1px 1px 0 rgba(6,3,10,.85); }
.legend .row .val.down{ color:var(--ui-coral); text-shadow:0 0 7px rgba(255,132,146,.32), 1px 1px 0 rgba(6,3,10,.85); }

/* ---------- 右栏「静音 / 暂停」按钮（原来贴在画布右上角，挪到侧栏后不再遮住游戏画面） ---------- */
.controls{ display:flex; gap:8px; }
.ctl{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
  padding:7px 4px 6px; cursor:pointer;
  font-family:inherit; font-size:11px; letter-spacing:1px; color:var(--ui-ink-dim);
  background:linear-gradient(180deg, #261831 0%, var(--ui-box-bg) 100%);
  border:3px solid var(--ui-line-dim);
  box-shadow:0 0 0 2px var(--ui-outline), inset 0 2px 0 rgba(255,255,255,.05), inset 0 -2px 0 rgba(0,0,0,.42);
  border-radius:10px;
}
.ctl .ctl-ico{ display:block; width:32px; height:24px; image-rendering:crisp-edges; image-rendering:pixelated; }
.ctl:hover{ border-color:var(--ui-mint); color:var(--ui-ink); }
.ctl:active{ transform:translateY(1px); }
/* 开关已生效（静音中 / 已暂停）：文字变水色 + 描边发光 */
.ctl.on{
  color:var(--ui-mint); border-color:var(--ui-mint);
  box-shadow:0 0 0 2px var(--ui-outline), inset 0 2px 0 rgba(255,255,255,.05),
             inset 0 -2px 0 rgba(0,0,0,.42), 0 0 10px rgba(143,224,189,.45);
}
/* 不在游戏中时暂停按钮无效（开始 / 结算界面本来就有自己的面板） */
.ctl.off{ opacity:.42; cursor:default; }
.ctl.off:hover{ border-color:var(--ui-line-dim); color:var(--ui-ink-dim); }
/* 左右移动键：桌面用鼠标跟随，不需要按钮，所以默认不显示，只在竖屏 .mode-tall 里出现 */
.ctl.move{ display:none; }

/* ---------- 技能框（分段进度条） ----------
 * 桌面：竖条，从下往上长，分格线是横线（一格一格往上叠）。
 * 竖屏：横条，从左往右长，分格线与光泽方向都在下面的 .mode-tall 段里一起转 90°。
 * ------------------------------------------------------------------------ */
.skill{
  flex:1; display:flex; flex-direction:column;
  background:linear-gradient(180deg, #261831 0%, var(--ui-box-bg) 100%);
  border:3px solid var(--ui-line-dim);
  box-shadow:0 0 0 2px var(--ui-outline), inset 0 2px 0 rgba(255,255,255,.05), inset 0 -2px 0 rgba(0,0,0,.42);
  border-radius:10px;
  padding:8px 6px;
}
/* 技能框顶部的青柠 logo（替代原来的「青柠效果」文字），尺寸见 CONFIG.SKILL_LOGO。
   min-height 由 JS 按实际图标高度写死，所以这里不写，避免两处数字不一致留空档 */
.skill-logo{ display:flex; justify-content:center; align-items:center; margin-bottom:6px; }
.skill-logo canvas{ display:block; image-rendering:crisp-edges; image-rendering:pixelated; }
.bar{
  flex:1; width:24px; min-height:150px; margin:0 auto; position:relative;
  background:#120b18; border:2px solid #3d2742;
  box-shadow:inset 0 2px 0 rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.5);
  border-radius:7px;       /* 进度条也圆一点，内部的填充会被 overflow 一起裁圆 */
  overflow:hidden;
}
/* 青柠色（背景图水色系）渐层 + 每 6px 一道暗缝 = 一格一格的像素电池 */
.bar i{
  /* 进度值由 JS 写进 --skill-pct：桌面是竖条（用高度），竖屏是横条（改成用宽度）。
     光泽一律横跨「条身宽度」：桌面 90deg（左右走向），竖屏换成 180deg（上下走向）。
     分格线一律垂直于生长方向：桌面 0deg（横线，一格一格往上叠），竖屏 90deg（竖线，一格一格往右排）。 */
  position:absolute; left:0; right:0; bottom:0; height:var(--skill-pct,0%);
  background:linear-gradient(90deg,#4a9a72 0%,#8fe0bd 42%,#eafff4 58%,#8fe0bd 76%,#4a9a72 100%);
}
/* 每 6px 一道暗缝 = 一格一格的像素电池；::after 跟着 i 走，所以只画在已填充的那一段上 */
.bar i::after{
  content:''; position:absolute; left:0; right:0; top:0; bottom:0;
  background-image:repeating-linear-gradient(0deg, rgba(10,4,12,.55) 0 1px, rgba(10,4,12,0) 1px 6px);
}
.bar.on{ border-color:var(--ui-mint); }
.bar.on i{ box-shadow:0 0 12px rgba(143,224,189,.7), inset 0 0 6px rgba(255,255,255,.85); }
#skillValue{
  text-align:center; font-size:16px; font-weight:700; margin-top:8px;
  color:var(--ui-ink-dim);
}
#skillValue.on{ color:var(--ui-mint); text-shadow:0 0 8px rgba(143,224,189,.55); }

/* =========================================================================
 * 手机 / 窄屏布局（.mode-tall）—— 上下堆叠
 *
 * 桌面是「左栏 | 画面 | 右栏」，但那至少要 900px 宽（两个侧栏 + 画面），
 * 手机竖屏根本放不下，所以窄屏改成三行。青柠条和左右移动键原本都住在右栏里，
 * 纯 CSS 搬不了家，由 JS 在切换布局时跨栏搬运（见 placeSkill() / UI.bindMove()）：
 *   顶栏 = 分数 / 时间 + 青柠效果条（食物分值说明在竖屏下隐藏，见下面 .mode-tall .legend）
 *   中间 = 游戏画面（flex:1 吃掉剩余高度，尺寸由 fitLayout() 量出来写死）
 *   底栏 = 左移 / 静音 / 暂停 / 右移（纪录栏竖屏不显示，改在死亡结算画面里看）
 * 类名由 JS 的 pickLayout() 判断「三栏放不放得下」后挂到 #app 上，纯 CSS 的媒体查询做不到这件事。
 * ========================================================================= */
#app.mode-tall{
  flex-direction:column; align-items:stretch; justify-content:flex-start;
  gap:6px;
  padding:calc(6px + env(safe-area-inset-top)) calc(6px + env(safe-area-inset-right))
          calc(6px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left));
}
#app.mode-tall .side{
  width:auto; min-height:0; padding:6px; gap:5px; border-width:2px; border-radius:10px;
}
#app.mode-tall .box{ flex:1 1 0; min-width:0; padding:3px 4px; border-width:2px; border-radius:8px; }
#app.mode-tall .box.mb{ margin-bottom:0; }
#app.mode-tall .box .label{ font-size:9px; letter-spacing:1px; margin-bottom:1px; }
#app.mode-tall .box .value{ font-size:16px; }
#app.mode-tall .box .value.tight{ font-size:13px; }

/* 顶栏：标题收起来（开始界面的画布里已经有标题了），分数框并排一行 */
#app.mode-tall .left .title-wrap{ display:none; }
#app.mode-tall .stats{ display:flex; gap:5px; }   /* 两个数字框并排一行（左右两栏各有一处） */
/* 画面：吃掉中间剩余的高度；具体尺寸由 fitLayout() 量出来，所以顶栏/底栏怎么变都不会溢出 */
#app.mode-tall .center{
  flex:1 1 0; min-height:0; padding:4px; border-width:2px; border-radius:10px;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
#app.mode-tall #game{ max-width:100%; max-height:100%; }

/* 顶栏第二行：青柠效果条（JS 从右栏搬进来的）。左栏是列布局，别让它被 flex:1 拉高 */
#app.mode-tall .left{ gap:5px; }
#app.mode-tall .left .skill{ flex:0 0 auto; }

/* 底栏：左移 / 静音 / 暂停 / 右移 一行排开，静音暂停夹在左右键中间 */
#app.mode-tall .right{ flex-direction:row; flex-wrap:nowrap; align-items:stretch; gap:5px; }
#app.mode-tall .controls{ flex:0 0 auto; gap:5px; }
#app.mode-tall .ctl{
  flex-direction:row; justify-content:center; gap:5px; padding:5px 9px;
  border-width:2px; border-radius:8px; font-size:11px;
}
/* 左右键吃掉剩余宽度；touch-action:none 让按住时不会顺手滚动页面 */
#app.mode-tall .ctl.move{ display:flex; flex:1 1 auto; min-width:52px; padding:5px 4px; touch-action:none; }
#app.mode-tall .ctl.move .move-ico{ font-size:15px; line-height:1; }
#app.mode-tall .skill{
  flex:1 1 140px; flex-direction:row; align-items:center; gap:6px;
  padding:5px 7px; border-width:2px; border-radius:8px;
}
#app.mode-tall .skill-logo{ margin:0; min-height:0; }
#app.mode-tall .bar{ flex:1; width:auto; height:16px; min-height:0; margin:0; border-radius:6px; }
#app.mode-tall .bar i{
  width:var(--skill-pct,0%); height:100%;
  /* 条子横过来后光泽也要跟着转：90deg → 180deg，否则亮带会横铺整条、填充头就看不出来了 */
  background:linear-gradient(180deg,#4a9a72 0%,#8fe0bd 42%,#eafff4 58%,#8fe0bd 76%,#4a9a72 100%);
}
/* 分格方向跟着条子转：0deg → 90deg，改成竖线分隔（沿 x 轴每 6px 一格，一格一格往右排）。
   不转的话 0deg 画的还是横线，那几道线会横穿 16px 高的条身，变成平行条纹而不是格子 */
#app.mode-tall .bar i::after{
  background-image:repeating-linear-gradient(90deg, rgba(10,4,12,.55) 0 1px, rgba(10,4,12,0) 1px 6px);
}
#app.mode-tall #skillValue{ margin:0; min-width:44px; text-align:right; font-size:14px; }
#app.mode-tall .right .stats{ display:none; }        /* 竖屏不再显示纪录栏（改在死亡结算画面里看） */

/* 竖屏（手机）收起「食物分值说明」：竖屏的每一像素高度都给画面更划算 ——
   分值本来就在开始/结算界面能看到，游戏里也随时看得见飘落的食物本身。
   想让它回来：删掉下面这一行即可 */
#app.mode-tall .legend{ display:none; }

/* 更矮的屏（iPhone SE 一类）：顶栏那个青柠 logo 收掉，省下的高度全给画面 ——
   进度条和剩余秒数照常在。原来这里收的是「最高分 / 最长生存」，而它在竖屏已经一律不显示了 */
#app.mode-tall.mode-compact .skill-logo{ display:none; }

/* =========================================================================
 * 宽屏但很矮（手机横屏 / 矮窗口）—— 三栏布局压扁版（.mode-short）
 *
 * 横屏手机宽 844 高只有 390：「三栏」在宽度上放得下，但右栏内容（静音暂停 + 技能条 + 纪录）
 * 自然高度有 480px，比屏幕还高，会被切掉。这里把内边距、间距、字号、进度条最小高度都压小，
 * 让它整栏塞进屏幕里。是否启用由 JS 的 fitLayout() 按可视高度判断（.mode-short 挂在 #app 上）。
 * ========================================================================= */
#app.mode-short .side{ padding:7px; gap:7px; min-height:0; }
#app.mode-short .title-wrap{ padding:2px 0; }
#app.mode-short .box{ padding:5px 4px; }
#app.mode-short .box .label{ font-size:9px; letter-spacing:1px; margin-bottom:2px; }
#app.mode-short .box .value{ font-size:15px; }
#app.mode-short .box.mb{ margin-bottom:7px; }
#app.mode-short .legend{ padding:5px 4px; gap:2px; }
#app.mode-short .legend .row{ min-height:22px; }
#app.mode-short .legend .row .val{ font-size:11px; }
#app.mode-short .controls{ gap:6px; }
#app.mode-short .ctl{ padding:5px 4px; font-size:10px; letter-spacing:0; }
#app.mode-short .ctl .ctl-ico{ width:16px; height:12px; }      /* 1× 原生尺寸，避免非整数缩放 */
#app.mode-short .skill{ padding:6px 5px; }
#app.mode-short .skill-logo{ min-height:0; margin-bottom:3px; }
#app.mode-short .bar{ min-height:60px; }
#app.mode-short #skillValue{ font-size:14px; margin-top:4px; }
</style>
</head>
<body>
<div id="app">
  <!-- ============ 左侧栏 ============ -->
  <aside class="panel side left">
    <div class="title-wrap"><canvas id="titleCanvas" width="64" height="17"></canvas></div>
    <div class="stats">
      <div class="box mb">
        <div class="label">SCORE</div>
        <div class="value" id="scoreValue">000000</div>
      </div>
      <div class="box">
        <div class="label">TIME</div>
        <div class="value" id="timeValue">0.0</div>
      </div>
    </div>
    <!-- 食物分值提示 -->
    <div class="legend" id="legend"></div>
  </aside>

  <!-- ============ 中间栏 ============ -->
  <main class="panel center">
    <canvas id="game" width="320" height="480"></canvas>
  </main>

  <!-- ============ 右侧栏 ============ -->
  <aside class="panel side right">
    <!-- 左右移动键：只在竖屏（.mode-tall）显示。按住持续移动，手感与 ←/→、A/D 完全一致 -->
    <button type="button" class="ctl move" id="moveLeftBtn" title="按住向左移动（← / A）">
      <span class="move-ico">◀</span>
    </button>
    <!-- 静音 / 暂停：快捷键分别是 M 和空格 -->
    <div class="controls">
      <button type="button" class="ctl" id="muteBtn" title="静音（快捷键 M）">
        <canvas class="ctl-ico" id="muteIcon" width="16" height="12"></canvas>
        <span id="muteText">静音</span>
      </button>
      <button type="button" class="ctl" id="pauseBtn" title="暂停游戏（空格）">
        <canvas class="ctl-ico" id="pauseIcon" width="16" height="12"></canvas>
        <span id="pauseText">暂停</span>
      </button>
    </div>
    <div class="skill" id="skillBox">
      <div class="skill-logo" id="skillLogo"></div>
      <div class="bar" id="skillBar"><i id="skillFill"></i></div>
      <div id="skillValue">--</div>
    </div>
    <!-- 历史纪录（存浏览器本地，关掉页面也不会丢） -->
    <div class="stats">
      <div class="box mb">
        <div class="label">最高分</div>
        <div class="value record" id="bestScoreValue">000000</div>
      </div>
      <div class="box">
        <div class="label">最长生存</div>
        <div class="value record" id="bestTimeValue">0.0 s</div>
      </div>
    </div>
    <button type="button" class="ctl move" id="moveRightBtn" title="按住向右移动（→ / D）">
      <span class="move-ico">▶</span>
    </button>
  </aside>
</div>

<script>
(function () {
'use strict';

/* =========================================================================
 * CONFIG —— 所有可调数值集中在此，改这里即可调平衡
 * ========================================================================= */
const CONFIG = {
  /* ── 逻辑分辨率（固定 320×480 竖屏，CSS 等比缩放） ── */
  VIEW_W: 320,
  VIEW_H: 480,

  /* ── 主循环 ── */
  FIXED_DT: 1 / 60,        // 固定时间步长（秒），保证不同刷新率速度一致
  MAX_FRAME_DT: 0.25,      // 单帧最大补偿时间，防止切后台后疯狂追帧
  MAX_STEPS: 8,            // 单帧最多跑的物理步数

  /* ── 玩家 ── */
  PLAYER: {
    RAW_W: 52, RAW_H: 46,  // 判定框尺寸，也是所有玩家帧统一拉齐到的尺寸（逐格数据见 PLAYER_SPRITE 等 4 张表）
                           // gudu-normal2 原生是 48×42，会按最近邻拉成 52×46，所以两张呼吸帧一样大
    SCALE: 1,              // 精灵放大倍数（1 = 原尺寸 52×46）。
                           // W/H、START_Y 全部由它推导（见 CONFIG 下面的推导块），
                           // 改这一个数就能整体放大缩小，不会再出现"精灵变大了判定框没跟上"的错位
    /* 严格跟随：true 时角色中心直接钉在指针上（不加速、不惯性、不打滑），
       A/D、←/→ 仍然可用 —— 按住时直接以 MAX_SPEED 推着目标点走。
       false 则回到下面那套「加速 + 阻尼」的手感，此时 ACCEL/DECEL/AIM_GAIN/AIM_DEADZONE/DAMPING 才生效 */
    STRICT_FOLLOW: true,
    ACCEL: 2000,           // 朝指针方向加速时的加速度 px/s²（仅 STRICT_FOLLOW=false 时用）
    DECEL: 3600,           // 接近指针 / 反向时的减速度 px/s²（仅 STRICT_FOLLOW=false 时用）
    MAX_SPEED: 320,        // 水平最大速度 px/s（严格跟随下 = 键盘推目标的速度；惯性模式下 = 速度上限）
    AIM_GAIN: 6.5,         // 跟随增益：期望速度 = 与指针的距离 × 增益（仅 STRICT_FOLLOW=false）
    AIM_DEADZONE: 2,       // 与指针距离小于该值即视为到位（仅 STRICT_FOLLOW=false）
    DAMPING: 7.5,          // 指针未知时的自然衰减系数（指数阻尼，越大停得越快）
    MARGIN: 2,             // 左右边界留白
    /* 角色纵向位置：中心落在「屏幕高度 × CENTER_Y_RATIO」处
       0.5 = 正中；0.667（= 2/3）= 屏幕下方那条 1/3 线；现在是 0.62 ≈ 中心 y 298（比 1/3 线再上移 22px）。
       只影响站位（START_Y），判定框、爆心、呼吸浮动都跟着它走 */
    CENTER_Y_RATIO: 0.62,
    BOB_AMP: 3,            // 待机呼吸浮动幅度（逻辑像素）
    BOB_SPEED: 8,        // 待机呼吸浮动频率
    EAT_FRAME_TIME: 0.22,  // 吃东西后切换成 gudu-eating 形象的持续时间（秒）；
                           // 期间再吃到东西会重新计时，所以连着吃就一直是大嘴表情
    FIT_FRAMES: true,      // true = 每帧都按最近邻拉伸到判定框尺寸，于是 gudu-normal2(48×42)
                           //       会和 gudu-normal(52×46) 看起来一样大（和两张原图的实际比例一致）；
                           // false = 各帧保留原生尺寸、居中画进去（gudu-normal2 会小一圈）
    WHITE: '#ffffff',      // 像素格里字符 '6' 的颜色（四张玩家像素表通用）
                           // 想点高光 / 眼睛反光 / 白色斑点，直接在表里把对应格子写成 '6' 即可；
                           // 想换成别的白（比如米白 #f4f0e6）只改这一行
  },

  /* ── 食物（RAW_W/RAW_H = 原始精灵尺寸；RAW_HW/RAW_HH = 原始命中盒尺寸；speed = 基础下落速度）
        SCALE = 精灵放大倍数。w/h/hw/hh 由下面「食物尺寸推导」算出，不要再手写死值 ——
        精灵是按 SCALE 生成的，配置里的数字一旦没跟上就会出现「精灵变大了但碰撞盒错位」：
        旋转轴心、堆积咬合量、生成时的左右边距都会一起错。
        RAW_W/RAW_H 必须与 FOOD_TABLES 里那张像素表的行/列数一致（表多大精灵就多大），
        否则旋转轴心、生成边距、堆积咬合都会错位。
        注意：堆积时以 hw/hh 作为碰撞箱，w/h 与 hw/hh 的差 = 相邻食物能重叠的像素数，
        所以把 RAW_HW/RAW_HH 调小会让堆叠更"咬合"、更蓬松；调到接近 RAW_W/RAW_H 则堆得越规整 ── */
  FOOD: {
    // 潜水艇：原始 72×46 / 命中 62×40 → ×1（submarine.png 的原生像素尺幅）
    sub:   { key:'sub',   name:'潜水艇', SCALE:1, RAW_W:72, RAW_H:46, RAW_HW:62, RAW_HH:40, score:  50, speed: 42, color:'#28405e' },
    // 薯条：原始 28×35 / 命中 24×31 → ×1（chips.png）
    fries: { key:'fries', name:'薯条',   SCALE:1, RAW_W:28, RAW_H:35, RAW_HW:24, RAW_HH:31, score: 130, speed: 78, color:'#b8860b' },
    // 狗屎：原始 23×22 / 命中 21×20 → ×1（shit.png）
    poop:  { key:'poop',  name:'狗屎',   SCALE:1, RAW_W:23, RAW_H:22, RAW_HW:21, RAW_HH:20, score: -50, speed: 70, color:'#4a2a10' },
    // 青柠：原始 12×11 / 命中 10×9 → ×1（lemon.png，仍然是全场最小号）
    lime:  { key:'lime',  name:'青柠',   SCALE:1, RAW_W:12, RAW_H:11, RAW_HW:10, RAW_HH: 9, score:  10, speed: 92, color:'#3d7a18' },
    // 冰淇淋：原始 32×31 / 命中 28×27 → ×1（icecream.png；青柠效果期间由狗屎转化而来）
    choco: { key:'choco', name:'冰淇淋', SCALE:1, RAW_W:32, RAW_H:31, RAW_HW:28, RAW_HH:27, score: 500, speed: 70, color:'#eff3f9' },
  },

  /* ── 青柠特殊效果 ── */
  LIME: {
    DURATION: 3.0,         // 持续秒数（再次吃到则重置为 3 秒，不叠加）。
                           // 侧栏进度条、闪烁预警、无敌/金泡泡判定全部由它推导，改这一个数就够
    BLINK_AT: 1.0,         // 剩余不足该秒数时，狗屎/巧克力/泡泡开始闪烁预警
    BLINK_HZ: 6,           // 闪烁频率（次/秒，即每秒来回切换几个来回）

    /* 无敌冲撞：效果期间泡泡整体变成金色，撞上去不再死亡，而是以**角色为圆心**炸开一圈 ——
       · 圈内的堆积物整块粉碎消失（按「个」算，不是抠像素），每个 +SCORE 分；
       · 圈内还没吃掉的下落食物一并算作被角色吃掉（加分，等同于真吃到）；
       · 掏空的地方就这么空着（要不要塌落见 STACK.SETTLE_AFTER_CRUSH，默认不塌）。
       爆开半径 = R_BASE + 泡泡半径 × R_PER（越大号的泡泡炸得越狠）。
       **判定线就是画出来的那圈环**：环是一个往外扫的冲击波（见 WAVE_*），
       每帧用「画环的同一个函数」算出当前半径，清掉这一刻圈内的东西 ——
       环扫到哪儿、东西碎到哪儿，慢动作看也不会对不上。又因为清掉的东西会从数组里消失，
       所以「只要环还活着，掉进圈里的东西照样会被清」，而不是只在触发那一瞬间判一次。
       判定口径（两者都跟着环走，所以环外的东西不会被误伤）：
         · 堆积物 —— **中心**落在圆内才算清掉，按「个」整块消失、不会只抠掉半个；
         · 下落食物 —— **精灵像素**碰到圆就算（宽松一档，见 EAT_ITEMS 与 spriteTouchesCircle），
           否则潜水艇这类长条明明有一角伸进了圈里，却因为中心还在圈外而毫发无伤
       计分：**只加分，绝不扣分** —— 堆积物每个 +SCORE（狗屎也照加，不按 -50 扣）；
       圈内还没吃掉的下落食物按各自分值，其中负分（狗屎 -50）在爆炸里按 0 算
       （见 blastScoreOf）—— 玩家自己张嘴吃到狗屎仍然是 -50。
       注意角色站位偏下（默认中心 y≈298，见 PLAYER.CENTER_Y_RATIO），堆积物得长上来才会被炸到 ——
       这正是「堆得越高、一炸越爽」的设计：想让低位也能炸到就把 R_BASE 调大 */
    CRUSH: {
      ENABLED: true,       // false = 取消金色无敌，回到「碰到泡泡必死」（金外观一并取消）
      CENTER_ON_PLAYER: true,  // 爆心（粉碎圆心）取角色而不是泡泡 —— 手感是「我身上炸开一圈」。
                               // false = 老行为：以泡泡位置为圆心
      EAT_ITEMS: true,     // 圈内还没吃掉的下落食物也算被角色吃掉（加分 + 张嘴表情 + 音效）；
                           //   判定是「食物像素碰到圈就算」（比堆积物的「中心进圈」宽松一档：
                           //   实测爆开圈只有 46~63px，而爆炸瞬间最近的食物平均在 116px 外，
                           //   用中心进圈几乎永远吃不到东西）
                           // false = 只清堆积物，不动下落中的食物
      /* 半径已大幅调小（原来是 70 + 4×半径 → 最大 138px，一下能清掉小半个屏幕）：
         现在是 32 + 1.8×半径 → 最小号 46px、最大号 63px，**面积只有原来的约 1/5**。
         缩小的手感冒险靠「连锁引爆」补回来：一炸一串，火苗会顺着圈里的泡泡一路传下去（见下面的 CHAIN） */
      R_BASE: 32,          // 爆开半径基数（逻辑像素）
      R_PER: 1.8,          // 每 1px 泡泡半径追加的半径（最小号 46px → 最大号 63px）
      SCORE: 100,          // 每粉碎掉一个堆积物加多少分
      POP_PARTICLES: 14,   // 泡泡爆开本身喷出的闪光碎屑数
      DEBRIS_PER_ITEM: 4,  // 每个被粉碎的堆积物额外喷出的碎屑数
      POP_LIFE: 0.45,      // 爆开碎屑存活秒数
      DEBRIS_LIFE: 0.55,   // 粉碎碎屑存活秒数
      PARTICLE_CAP: 400,   // 碎屑总数上限（超过就不再生成，防止极端情况掉帧）

      /* 一圈像素冲击波：从爆炸中心往外扫到最大半径（R_BASE + 泡泡半径 × R_PER）。
         它**不只是指示特效** —— 判定就是照着这一圈的当前半径做的（见 sweepBlast）：
         环扫到哪儿、堆积物就碎到哪儿、圈里的食物就吃到哪儿、圈里的泡泡就点着哪儿。
         所以「先把环画出来、再让判定追着环跑」，两边用的是同一个 blastRadius()，不可能对不上。
         环停在最大半径之后还会再亮 WAVE_FADE 秒；这期间掉进圈里的东西照样会被清
         （玩家看到圈还在，就会认为那里还是危险区）。
         炸不到东西时（堆还太矮）也会放这一圈，等于告诉玩家「范围到这儿，只是这儿没东西」 */
      WAVE_LIFE: 0.5,      // 冲击波存活秒数（= 危险区持续时间）
      WAVE_EXPAND: 0.26,   // 扩散到最大半径所需秒数（先快后慢），之后停在边界上淡出
      WAVE_FADE: 0.16,     // 到达最大半径后，用最后这么多秒把环淡掉
      WAVE_THICK: 3,       // 环的厚度（像素）
      WAVE_FLASH: 0.13,    // 内部实心闪光（低透明度圆盘）持续秒数

      /* 连锁引爆：一圈冲击波扫到别的泡泡时把它也点着；被点着的泡泡再以「它自己」为圆心炸一圈
         （半径同样 = R_BASE + 它自己的半径 × R_PER），可以继续往下一层传，像一串鞭炮。
         因为判定跟着环走，连锁也是一圈圈「传」出去的，而不是同一帧里同时炸开。
         只有玩家撞出来的第一炸圆心钉在角色身上（CENTER_ON_PLAYER）；连锁的那几炸都是泡泡原地开花，
         否则所有环都会叠在角色身上、看起来像没动 */
      CHAIN: {
        ENABLED: true,     // false = 只炸撞到的这一个泡泡，不再往下传
        MAX_DEPTH: 6,      // 连锁层数上限（1 = 只引爆第一层，不再往下传）
        MAX_TOTAL: 24,     // 单次触发最多引爆多少个泡泡（防止极端情况一帧炸掉半个屏幕）
        EAT_SOUND: false,  // 连锁的那几炸是否也播吃东西音效（一声就够，默认只有第一炸出声）
        SOUND_ONCE: true,  // 一次触发里「泡泡炸开」bubble 与「炸碎物品」broken 各最多播一声
                           //   （「碎掉」= 堆积物被炸碎，或被炸掉的下落食物，两者共用这一声）；
                           //   false = 每炸一个泡泡播一次 bubble、每碎一次播一次 broken
                           //   （连锁会在同一帧里叠好几个声音，听起来只是变响、发糊，所以默认只一声）
      },
    },
  },

  /* ── 生成器 / 难度曲线 ── */
  SPAWN: {
    RAMP_TIME: 90,                 // 难度从初值爬升到终值所需秒数
    FOOD_INTERVAL_START: 0.9,      // 初始食物生成间隔（秒）；到 FOOD_INTERVAL_END 之间走 S 形缓动
    FOOD_INTERVAL_END: 0.10,       // 后期食物生成间隔（秒）：90 秒起，主食物流（狗屎那串 + 青柠）
                                   //   比初值密 9 倍。注意：这一格只管**狗屎** ——
                                   //   薯条/潜水艇有自己的计时器，青柠按下面的「目标间隔」反解权重，
                                   //   两者都不受这里影响（见 Spawner.limeWeight / friesInterval）
                                   // 实测 90 秒后（跑测，个/分钟）：
                                   //   狗屎 103 → 254 · 薯条 71 → 97 · 潜水艇 21 → 30 · 青柠 5.6 → 7.2
    BUBBLE_INTERVAL_START: 3.5,    // 初始泡泡生成间隔（秒）
    BUBBLE_INTERVAL_END: 0.8,      // 后期泡泡生成间隔（秒）
    MARGIN_X: 4,                   // 食物生成时左右边距
    WEIGHTS_START: { sub:15, fries:30, poop:30, lime:25 }, // t=0s 权重表（poop / lime 会被下面的专属曲线覆盖）
    WEIGHTS_END:   { sub:55, fries:25, poop:46, lime: 5 }, // t=90s+ 权重表（poop 项是狗屎曲线在 90s 的「增量」：
                                                           //   终值 = POOP_BASE_WEIGHT + 该项 = 60；sub/fries
                                                           //   两项只是给狗屎「垫底」的配重（它们自己有计时器），
                                                           //   所以调大 poop 只会让狗屎变多，不会挤掉薯条/潜水艇
    /* 青柠：LIME_DELAY 之前完全不出现；之后平均出现间隔一路拉长，到 LIME_RAMP_END 秒拉到最长并保持。
       这里直接配置「目标平均出现间隔（秒/个）」，再由它反解权重，
       这样即使后期整体食物生成变快，青柠的实际出现频率也不会被带着反弹升高 */
    LIME_DELAY: 12,                // 青柠从第几秒才开始出现（之前权重恒为 0）
    LIME_RAMP_END: 50,             // 出现间隔拉到最长的时刻
    LIME_START_INTERVAL: 8,        // LIME_DELAY 时刻的平均出现间隔（秒/个），此时最密
    LIME_MIN_INTERVAL: 9.2,        // 最长的平均出现间隔（秒/个），50s 之后保持（原 10）。
                                   // 这是**名义**间隔：随机抽取 + LIME_MAX_GAP 空窗保护之后，
                                   // 实测后期 8.4 秒/个（原 9.5 秒/个，小幅 +14%）
    /* 空窗保护：距上一个青柠超过这么久，下一个空位就直接给它 —— 平均间隔仍由上面的目标值决定，
       这里只砍「尾部」（纯随机会出现 30~55 秒一个都没有的空档）。16 = 后期最长空窗 16 秒
       （实测间隔中位数 7.0 秒、p90 = 16 秒；调成 20 时 p90 也是 20，也就是每十个空档就有一个 ≳20 秒）。
       青柠是唯一能清屏的道具，空档期体验很差，所以这个上限比平均间隔更影响手感。
       0 = 关闭（回到纯随机） */
    LIME_MAX_GAP: 16,
    /* 潜水艇：拥有**独立计时器**（不再和其它食物抢格子），刷新频率是一条连续曲线 ——
       第 SUB_DELAY 秒开始出现，先花 SUB_RISE 秒从 0 淡入到 SUB_RATE_START（个/秒），
       再平滑地一路涨到 SUB_RATE_CAP（RAMP_TIME 秒吃满），之后保持。
       原来这里是「每 SUB_GROWTH_PERIOD 秒 ×SUB_GROWTH」的阶梯 + 到点突然封顶，已改成连续曲线 */
    SUB_DELAY: 3,                  // 潜水艇从第几秒才开始出现（之前完全不生成）
    SUB_RISE: 6,                   // 从 0 平滑淡入到 SUB_RATE_START 用的秒数（0 = 一到 SUB_DELAY 就跳上去）
    SUB_RATE_START: 0.12,          // 起步刷新频率（个/秒）＝ 8.3 秒一个
    SUB_RATE_CAP: 0.62,            // 频率上限（个/秒）＝ 约 1.6 秒一个（实测后期 30 个/分钟）。

                                   //   真到屏幕上会不会糊成一片由下面两道反成堆闸把关，
                                   //   见 SUB_MIN_GAP / SUB_MAX_FLIGHT —— 曲线只管「平均想多快」，
                                   //   闸门管「实际多密」，所以抬上限不等于屏幕上会变糊

    SUB_MIN_GAP: 1.5,              // 两条之间至少间隔这么多秒（硬下限，0 = 不限制；
                                   //   原来只靠 SUB_RANDOM_MIN=0.3 限幅，最快能到 0.3×平均间隔）
    SUB_GAP_MAX: 8,                // 两条之间最多隔这么多秒（硬上限）。必须留一个上限：
                                   //   间隔是 1/频率 算出来的，淡入段刚开始时频率≈0 →
                                   //   1/0 会算出天文数字、subTimer 被顶到「这辈子不再生成」
                                   //   （实测踩过：整局只出 1 个潜水艇）。8 秒也顺手砍掉指数分布的
                                   //   超长尾巴，免得后期出现「半天没有一条」
    SUB_MAX_FLIGHT: 3,             // 屏幕上最多同时有几条还在往下飘（不含已落地堆起来的）；
                                   //   到上限就跳过这一次，不再补发，等下一个计时周期

    POOP_RISE: 6,                  // 从 0 平滑淡入到 POOP_BASE_WEIGHT 用的秒数

    POOP_BASE_WEIGHT: 14,          // 淡入完成后的基础权重（这段之后由曲线继续往上爬）
  },

/* 玩家尺寸 / 纵向站位统一由 PLAYER.SCALE 与 PLAYER.CENTER_Y_RATIO 推导：
   只改 SCALE 一个数就能整体放大缩小，不会出现「精灵变大了但判定框没跟上」的错位 */
CONFIG.PLAYER.W = CONFIG.PLAYER.RAW_W * CONFIG.PLAYER.SCALE;
CONFIG.PLAYER.H = CONFIG.PLAYER.RAW_H * CONFIG.PLAYER.SCALE;
/* 角色起点 = 中心落在 CENTER_Y_RATIO 那条线上，再夹到「整个判定框都在画面内」。
   这里不用 clamp()：那个函数在下面的工具区才定义，此处还在它的作用域之前 */
CONFIG.PLAYER.START_Y = Math.round(Math.max(0, Math.min(
  CONFIG.VIEW_H - CONFIG.PLAYER.H,
  CONFIG.VIEW_H * CONFIG.PLAYER.CENTER_Y_RATIO - CONFIG.PLAYER.H / 2)));

/* 食物尺寸 / 命中盒同样统一由 SCALE 推导：
   w/h   = 原始精灵尺寸 × SCALE（必须与实际生成的精灵一致，否则旋转轴心、生成边距都会错）
   hw/hh = w/h 减去「原始每侧内缩量 × SCALE」（按内缩量推导可保证 offOf() 始终是整数像素） */
for (const k in CONFIG.FOOD) {
  const c = CONFIG.FOOD[k];
  c.w  = c.RAW_W * c.SCALE;
  c.h  = c.RAW_H * c.SCALE;
  c.hw = c.w - 2 * Math.round((c.RAW_W - c.RAW_HW) / 2 * c.SCALE);
  c.hh = c.h - 2 * Math.round((c.RAW_H - c.RAW_HH) / 2 * c.SCALE);
}

/* =========================================================================
 * 工具函数
 * ========================================================================= */
const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
const lerp  = (a, b, t) => a + (b - a) * t;

/**
 * 平滑缓动（smootherstep）：k = 0 与 k = 1 处的一阶、二阶导都为 0。
 * 难度曲线全部用它插值 —— 线性插值的两头是「折角」（开局刚开始变快、到点突然不再变），
 * 而这个函数是 S 形：起步慢慢加、中段最快、到点又慢慢收，所以玩起来是「一直在变难」而不是「跳档」。
 */
const smoothStep = (k) => k * k * k * (k * (k * 6 - 15) + 10);
const rand  = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));

function px(g, x, y, w, h, color) { g.fillStyle = color; g.fillRect(x, y, w, h); }

/** 像素化实心椭圆（逐行扫描线） */
function fillEllipse(g, cx, cy, rx, ry, color) {
  g.fillStyle = color;
  for (let y = -ry; y <= ry; y++) {
    const t = 1 - (y * y) / (ry * ry);
    if (t < 0) continue;
    const half = Math.floor(rx * Math.sqrt(t) + 1e-6);
    g.fillRect(Math.round(cx - half), Math.round(cy + y), half * 2 + 1, 1);
  }
}

/** 像素化实心圆 */
function pixelCircle(g, cx, cy, r, color) { fillEllipse(g, cx, cy, r, r, color); }

/**
 * 像素化实心圆环（逐行扫描线，跟 fillEllipse 同一套像素风格）：
 * 每行只画「外半宽」与「内半宽」之间的两段，所以环是硬边像素方块、不是抗锯齿圆弧。
 * r 小于等于 thickness 时退化成实心圆。
 */
function pixelRing(g, cx, cy, r, thickness, color) {
  const inner = r - thickness;
  if (!(r > 0)) return;
  g.fillStyle = color;
  const yi = Math.round(r);
  for (let y = -yi; y <= yi; y++) {
    const to = 1 - (y * y) / (r * r);
    if (to < 0) continue;
    const ho = Math.floor(r * Math.sqrt(to) + 1e-6);
    const ti = inner > 0 ? 1 - (y * y) / (inner * inner) : -1;
    const hi = ti > 0 ? Math.floor(inner * Math.sqrt(ti) + 1e-6) : -1;
    if (ho < 0) continue;
    const rowY = Math.round(cy + y);
    const left = Math.round(cx - ho), right = Math.round(cx + ho);
    if (hi < 0) { g.fillRect(left, rowY, right - left + 1, 1); continue; }
    const li = Math.round(cx - hi), ri = Math.round(cx + hi);
    g.fillRect(left, rowY, li - left, 1);            // 左半环
    g.fillRect(ri + 1, rowY, right - ri, 1);         // 右半环
  }
}

function makeCanvas(w, h, readFrequently) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d', readFrequently ? { willReadFrequently: true } : undefined);
  g.imageSmoothingEnabled = false;
  return c;
}

/** 用绘制函数生成一张离屏精灵 */
function sprite(w, h, fn) {
  const c = makeCanvas(w, h);
  fn(c.getContext('2d'), c);
  return c;
}

/** '#rrggbb' → [r, g, b] */
function hexRGB(hex) {
  const v = parseInt(hex.replace('#', ''), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}

/** 整数倍放大一张精灵（关闭插值，放大后仍是锐利的像素方块） */
function scaledSprite(src, n) {
  if (n === 1) return src;
  const c = makeCanvas(src.width * n, src.height * n);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}

/** 把精灵按最近邻拉伸成指定尺寸（像素风缩放，不做插值）。
    用来把原生格子大小不同的帧对齐到同一尺寸，例如 gudu-normal2(48×42) → 52×46 */
function fitSprite(src, w, h) {
  if (src.width === w && src.height === h) return src;
  const c = makeCanvas(w, h);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(src, 0, 0, src.width, src.height, 0, 0, w, h);
  return c;
}

/**
 * 读取精灵的真实像素轮廓：每一列第一个/最后一个不透明像素的行号（-1 = 该列整列透明）。
 * 堆积系统用它得到食物真正的轮廓顶部，而不是外接矩形顶部。
 */
function silhouetteOf(canvas) {
  const w = canvas.width, h = canvas.height;
  const d = canvas.getContext('2d').getImageData(0, 0, w, h).data;
  const top = new Int16Array(w), bot = new Int16Array(w);
  for (let x = 0; x < w; x++) {
    let a = -1, b = -1;
    for (let y = 0; y < h; y++) {
      if (d[(y * w + x) * 4 + 3] > 24) { if (a < 0) a = y; b = y; }
    }
    top[x] = a;
    bot[x] = b;
  }
  return { top: top, bot: bot };
}

/**
 * 取一张精灵里出现次数最多的 n 个不透明颜色（碎屑颜色用）。
 * 出现最多的那几个就是这坨食物的主体颜色，碎屑喷出来和它同色，看上去才像是它被炸碎的。
 */
function sampleColors(canvas, n) {
  const d = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
  const count = {};
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] < 200) continue;
    const hex = '#' + ((1 << 24) + (d[i] << 16) + (d[i + 1] << 8) + d[i + 2]).toString(16).slice(1);
    count[hex] = (count[hex] || 0) + 1;
  }
  return Object.keys(count).sort(function (a, b) { return count[b] - count[a]; }).slice(0, n);
}

/**
 * 读取精灵的不透明掩码（1 = 该像素看得见），供像素级碰撞使用。
 * 阈值与 silhouetteOf 一致（alpha > 24）。
 */
function buildMask(canvas) {
  const w = canvas.width, h = canvas.height;
  const d = canvas.getContext('2d').getImageData(0, 0, w, h).data;
  const m = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) m[i] = d[i * 4 + 3] > 24 ? 1 : 0;
  return { w: w, h: h, m: m };
}

/**
 * 生成堆积层专用的「灰蓝调 + 黑勾边」精灵。
 * 亮度按原图明暗重映射到 PILE_DARK → PILE_LIGHT 这条灰蓝渐变上，所以块与块之间依然能看出立体感。
 * 只改 RGB，alpha 原样保留 —— 尺寸、轮廓、拖影蒙版全都没变，所以堆叠计算完全不受影响。
 * 勾边描在轮廓内侧 1px（四邻域探空，画布外也算空）：这样精灵不会被撑大，
 * 相邻两块之间自然形成黑色分隔线。
 */
function pileTint(src) {
  const w = src.width, h = src.height;
  const out = makeCanvas(w, h, true);
  const g = out.getContext('2d');
  g.drawImage(src, 0, 0);
  const img = g.getImageData(0, 0, w, h);
  const p = img.data;
  const solid = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) solid[i] = p[i * 4 + 3] > 24 ? 1 : 0;

  const dk = hexRGB(CONFIG.STACK.PILE_DARK);
  const lt = hexRGB(CONFIG.STACK.PILE_LIGHT);
  const oc = hexRGB(CONFIG.STACK.OUTLINE);

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const k = y * w + x;
      if (!solid[k]) continue;
      const i = k * 4;
      const edge = x === 0 || y === 0 || x === w - 1 || y === h - 1 ||
                   !solid[k - 1] || !solid[k + 1] || !solid[k - w] || !solid[k + w];
      if (edge) { p[i] = oc[0]; p[i + 1] = oc[1]; p[i + 2] = oc[2]; continue; }
      const t = (0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]) / 255;
      p[i]     = Math.round(dk[0] + (lt[0] - dk[0]) * t);
      p[i + 1] = Math.round(dk[1] + (lt[1] - dk[1]) * t);
      p[i + 2] = Math.round(dk[2] + (lt[2] - dk[2]) * t);
    }
  }
  g.putImageData(img, 0, 0);
  return out;
}

/** 咕嘟咕噜兽：按像素表逐格上色，颜色取当前配色。
    table 传 PLAYER_SPRITE / PLAYER_SPRITE_B / PLAYER_EATING / PLAYER_EATING_LIME，
    四张表宽高可以不一样（绘制时会自动居中到判定框里） */
function drawMonster(g, p, table) {
  const C = { 1: p.main, 2: p.mouth, 3: p.dark, 4: p.shade, 5: p.deep, 6: p.white, 7: p.hi };
  for (let y = 0; y < table.length; y++) {
    const row = table[y];
    for (let x = 0; x < row.length; x++) {
      const col = C[row[x]];
      if (col) px(g, x, y, 1, 1, col);
    }
  }
}

/** 按像素表 + 调色板逐格绘制（'.' 跳过）。食物精灵和左栏标题共用这一套 */
function drawPixelTable(g, def) {
  const C = {};
  for (let i = 0; i < def.pal.length; i++) C[FOOD_CHARS.charAt(i)] = def.pal[i];
  const rows = def.rows;
  for (let y = 0; y < rows.length; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length; x++) {
      const col = C[row[x]];
      if (col) px(g, x, y, 1, 1, col);
    }
  }
}

/* 泡泡配色：普通（致命 · 青蓝）与金色（青柠无敌期）。两者只有颜色不同、几何逐像素一致，
   所以金色泡泡的判定掩码与普通泡泡完全相同（掩码统一取自 Assets.bubble，见 Assets.init） */
const BUBBLE_PAL = {
  rim:  'rgba(242,253,255,1)',      // 外圈：近白 + 满不透明，深海底色下最跳
  ring: 'rgba(168,232,255,0.95)',   // 再叠一层亮青 → 合成 2px 厚的环（原 1px）
  fill: 'rgba(160,225,255,0.30)',   // 内部填充（原 0.20；透明度还在，只是更亮）
  hi:   'rgba(255,255,255,0.95)',   // 高光（原 0.85，并放大一点）
};
const BUBBLE_PAL_GOLD = {
  rim:  'rgba(255,250,205,1)',      // 外圈：近金白
  ring: 'rgba(255,193,38,0.98)',    // 金色环（比普通泡泡的环更实，金色才压得住背景）
  fill: 'rgba(255,171,20,0.34)',    // 内部金色
  hi:   'rgba(255,255,240,0.98)',
};

/**
 * 泡泡：亮的双层圆环 + 半透明内部 + 高光。
 * 所有像素都画在半径 r 以内，精灵外轮廓就是判定掩码（半径 r 的实心圆）：
 * 这里只调配色和环的粗细，碰撞箱不变 —— 想改判定大小请改 CONFIG.BUBBLE 的半径。
 * pal 只换颜色，不改变任何像素的覆盖范围（金色版与普通版的外轮廓逐像素相同）。
 */
function drawBubble(g, cx, cy, r, pal) {
  pal = pal || BUBBLE_PAL;
  pixelCircle(g, cx, cy, r, pal.rim);
  pixelCircle(g, cx, cy, r - 1, pal.ring);
  g.globalCompositeOperation = 'destination-out';
  pixelCircle(g, cx, cy, r - 2, '#000');                     // 挖掉环以内，泡泡内部保持透明
  g.globalCompositeOperation = 'source-over';
  pixelCircle(g, cx, cy, r - 2, pal.fill);
  g.fillStyle = pal.hi;
  const hx = cx - Math.round(r * 0.42), hy = cy - Math.round(r * 0.42);
  g.fillRect(hx, hy, Math.max(2, Math.round(r * 0.42)), 2);
  g.fillRect(hx, hy + 2, 2, Math.max(1, Math.round(r * 0.32)));
}

/** 背景的竖向渐变（背景绘制与「缝隙填充色」共用，保证两者颜色完全一致） */
function bgGradient(g) {
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#071a2e');
  grad.addColorStop(0.55, '#0a2540');
  grad.addColorStop(1, '#0e3355');
  return grad;
}

/** 背景：深海水域渐变 + 微弱像素网格（内嵌背景图解码完成前的兜底） */
function drawBg(g, W, H) {
  g.fillStyle = bgGradient(g); g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(120,190,255,0.045)';
  for (let y = 0; y < H; y += 16) g.fillRect(0, y, W, 1);
  for (let x = 0; x < W; x += 16) g.fillRect(x, 0, 1, H);
  for (let i = 0; i < 70; i++) {
    g.fillStyle = 'rgba(150,215,255,' + (0.05 + Math.random() * 0.12).toFixed(3) + ')';
    g.fillRect(Math.floor(Math.random() * W), Math.floor(Math.random() * H), 2, 2);
  }
}

  const combos = [
    [PLAYER_PALETTES[PAL_NORMAL], PLAYER_SPRITE],        // 0 常态 · 呼吸 A（gudu-normal）
    [PLAYER_PALETTES[PAL_NORMAL], PLAYER_SPRITE_B],      // 1 常态 · 呼吸 B（gudu-normal2）
    [PLAYER_PALETTES[PAL_NORMAL], PLAYER_EATING],        // 2 常态 · 吃东西（gudu-eating）
    [PLAYER_PALETTES[PAL_LIME],   PLAYER_GREEND],        // 3 青柠 · 呼吸 A（greendu-normal 原色）
    [PLAYER_GREEND2_PAL,          PLAYER_GREEND_B],      // 4 青柠 · 呼吸 B（greendu-normal2 原色）
    [PLAYER_LIME_EAT_PAL,         PLAYER_EATING_LIME],   // 5 青柠 · 吃东西（greendu-eating 原色）
  ];
  Assets.player = combos.map(function (c) {
    const pal = c[0], table = c[1];
    const img = sprite(table[0].length, table.length, function (g) { drawMonster(g, pal, table); });
    return scaledSprite(
      CONFIG.PLAYER.FIT_FRAMES ? fitSprite(img, CONFIG.PLAYER.RAW_W, CONFIG.PLAYER.RAW_H) : img,
      CONFIG.PLAYER.SCALE);
  });
  /* 食物精灵全部由 FOOD_TABLES 的像素表生成（表多大就画多大，SCALE 固定 1） */
  Assets.food = {};
  Assets.foodIcon = {};   // 左栏「食物分值提示」用的小号图标（游戏精灵的原生尺寸塞不进侧栏）
  for (const k in CONFIG.FOOD) {
    const t = FOOD_TABLES[k];
    const big = sprite(t.rows[0].length, t.rows.length, function (c) { drawPixelTable(c, t); });
    Assets.food[k] = scaledSprite(big, CONFIG.FOOD[k].SCALE);
    Assets.foodIcon[k] = sprite(t.icon.rows[0].length, t.icon.rows.length, function (c) {
      drawPixelTable(c, t.icon);
    });
  }
  Assets.bubble = [];
  Assets.bubbleGold = [];   // 青柠无敌期的金色版（同一套几何，只有配色不同）
  // 精灵缓存只做「可能出现的半径」这一档（半径 = 数组下标）
  for (let r = CONFIG.BUBBLE.R_MIN; r <= CONFIG.BUBBLE.R_MAX; r++) {
    Assets.bubble[r] = sprite(r * 2 + 2, r * 2 + 2, function (g) {
      drawBubble(g, r + 1, r + 1, r);
    });
    Assets.bubbleGold[r] = sprite(r * 2 + 2, r * 2 + 2, function (g) {
      drawBubble(g, r + 1, r + 1, r, BUBBLE_PAL_GOLD);
    });
  }
  // 堆积层里统一画「灰蓝调 + 黑勾边」版本；下落中的食物保持原色，方便一眼看清
  Assets.foodPile = {};
  for (const k in Assets.food) Assets.foodPile[k] = pileTint(Assets.food[k]);

  // 每种堆积食物取几个"最常出现的"真实像素颜色，粉碎时喷的碎屑直接用它们（比手写调色板贴）
  Assets.pileColors = {};
  for (const k in Assets.foodPile) Assets.pileColors[k] = sampleColors(Assets.foodPile[k], 6);

  // 每种食物的像素轮廓（堆积系统按真实轮廓堆叠，而不是按外接矩形）
  Assets.sil = {};
  for (const k in Assets.food) Assets.sil[k] = silhouetteOf(Assets.food[k]);

  // 像素级碰撞用的不透明掩码（始终取呼吸 A 那一张：换表情/换呼吸帧都不改变判定框，手感稳定）
  Assets.mask = { player: buildMask(Assets.player[0]), food: {}, bubble: [] };
  for (const k in Assets.food) Assets.mask.food[k] = buildMask(Assets.food[k]);
  /* 泡泡的判定掩码不直接用精灵，而是另画一个「内圈」实心圆：
     画布尺寸、圆心与精灵完全一致（都是 r*2+2、圆心 r+1），所以命中判定的坐标换算不用改，
     只是不透明像素少了一圈 —— 亮边不参与碰撞。见 CONFIG.BUBBLE.HIT_INSET */
  for (let r = CONFIG.BUBBLE.R_MIN; r <= CONFIG.BUBBLE.R_MAX; r++) {
    const hr = Math.max(1, r - CONFIG.BUBBLE.HIT_INSET);
    Assets.mask.bubble[r] = buildMask(sprite(r * 2 + 2, r * 2 + 2, function (g) {
      pixelCircle(g, r + 1, r + 1, hr, '#ffffff');
    }));
  }

  // 背景（默认先用程序化渐变顶上）
  Assets.bg = sprite(W, H, function (g) { drawBg(g, W, H); });
  setBgPixels();
  if (CONFIG.BG.USE_IMAGE) loadBgImage();
}

/**
 * 把「补缝用」的背景像素表同步成当前背景。
 * 堆积层的缝隙按它逐像素填，填出来的颜色与背景完全一致，
 * 于是缝看起来就是"堆与堆之间的空隙"，而堆积层依然是不透明的、照样遮挡后面的东西。
 */
function setBgPixels() {
  const g = Assets.bg.getContext('2d');
  Assets.bgPix = new Uint32Array(g.getImageData(0, 0, W, H).data.buffer).slice();
  /* 堆积层的「缝隙色」直接取这张表（见 fillCols）。背景图是异步解码的，
     解码完成会再调一次这里 —— 这时已经堆进 layer 的缝隙用的还是旧的渐变颜色，
     所以要标脏重画一次，让缝隙跟上真背景色（还没 init 时 layer 为空，跳过） */
  if (StackSystem.layer && StackSystem.items.length) StackSystem.dirty = true;
}

/** 解码内嵌背景像素图并替换掉渐变兜底图（1:1 贴，不缩放，保证像素锐利） */
function loadBgImage() {
  const img = new Image();
  img.onload = function () {
    const oy = clamp(Math.round(CONFIG.BG.OFFSET_Y), 0, Math.max(0, img.height - H));
    const c = makeCanvas(W, H, true);
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(img, 0, oy, W, H, 0, 0, W, H);
    try {
      Assets.bg = c;
      setBgPixels();
    } catch (e) {
      // 内存紧张时 getImageData 可能失败：背景已经画好了，只是补缝用的像素表拿不到
      if (window.console && console.warn) console.warn('[咕嘟咕噜兽] 背景像素表读取失败（已用近似值兜底）：', e);
    }
  };
  // 内嵌背景图解码失败（极端内存紧张）时保留程序化渐变兜底，游戏照常能玩
  img.onerror = function () {
    if (window.console && console.warn) console.warn('[咕嘟咕噜兽] 背景图解码失败，改用渐变背景');
  };
  img.src = BG_IMAGE_DATA;
}

/* =========================================================================
 * 游戏状态
 * ========================================================================= */
const W = CONFIG.VIEW_W, H = CONFIG.VIEW_H;
const COLS = W;                  // 堆积层按像素列记录（每列 1px 宽），轮廓最精确

const GameState = {
  mode: 'menu',        // menu | playing | paused | dying | gameover
  score: 0,
  elapsed: 0,
  limeTimer: 0,
  eatTimer: 0,         // > 0 时角色画成 gudu-eating（吃东西表情）
  deathTimer: 0,
  flash: 0,
  particles: [],
  blasts: [],          // 泡泡爆开的范围指示环（见 spawnBlast）
  chainCount: 0,       // 本次触发的连锁引爆已点着几个泡泡（见 CONFIG.LIME.CRUSH.CHAIN）
  popSfxDone: false,   // 本次触发是否已经放过「泡泡炸开」音效（见 CHAIN.SOUND_ONCE）
  brokenSfxDone: false,// 本次触发是否已经放过「炸碎物品」音效（堆积物粉碎或被炸掉的掉落物）
};

function resetGame() {
  GameState.score = 0;
  GameState.elapsed = 0;
  GameState.limeTimer = 0;
  GameState.eatTimer = 0;
  GameState.deathTimer = 0;
  GameState.flash = 0;
  GameState.particles.length = 0;
  GameState.blasts.length = 0;
  Player.reset();
  items.length = 0;
  bubbles.length = 0;
  StackSystem.reset();
  Spawner.reset();
  UI.reset();
  UI.syncScore(true);
}

/* =========================================================================
 * Records —— 历史纪录：最高分 / 最长生存时间
 * 存在浏览器 localStorage 里（关掉页面也在）；读不到（如隐私模式、部分
 * file:// 环境）就退化为「只在本局有效」，不影响游戏。
 * ========================================================================= */
const Records = {
  score: 0,
  time: 0,
  savedAt: 0,        // 上次落盘时的存活时间（配合 SAVE_EVERY 做节流）
  dirty: false,      // 内存里的纪录还没写盘

  load: function () {
    try {
      const raw = localStorage.getItem(CONFIG.RECORDS.KEY);
      if (!raw) return;
      const o = JSON.parse(raw);
      this.score = Math.max(0, Number(o.score) || 0);
      this.time = Math.max(0, Number(o.time) || 0);
    } catch (e) { /* 存储不可用：忽略，只在本局内存里记 */ }
    this.savedAt = this.time;
  },

  save: function () {
    this.savedAt = this.time;
    this.dirty = false;
    try {
      localStorage.setItem(CONFIG.RECORDS.KEY, JSON.stringify({ score: this.score, time: this.time }));
    } catch (e) { /* 存储不可用：忽略 */ }
  },

  /** 把还没落盘的纪录立刻写盘（死亡 / 切后台 / 关页面时调用） */
  flush: function () { if (this.dirty) this.save(); },

  /** 用本局当前的分数/存活时间刷新纪录；返回 true 表示刷新了（调用方据此播动画） */
  submit: function (score, time) {
    let hit = false;
    if (score > this.score) { this.score = score; hit = true; }
    if (time > this.time) { this.time = time; hit = true; }
    if (hit) {
      this.dirty = true;   // 存活时间每帧都在涨，所以写盘要节流，其余时机由 flush 补写
      if (time - this.savedAt >= CONFIG.RECORDS.SAVE_EVERY) this.save();
    }
    return hit;
  },
};

/* =========================================================================
 * Player —— 玩家实体：横向跟随指针（带加速/限速/到位缓停）+ 呼吸浮动
 * ========================================================================= */
const Player = {
  x: 0, y: CONFIG.PLAYER.START_Y, vx: 0, bob: 0, dir: 1,
  reset: function () {
    this.x = (W - CONFIG.PLAYER.W) / 2;
    this.y = CONFIG.PLAYER.START_Y;
    this.vx = 0;
    this.bob = 0;
    this.dir = 1;
  },
  update: function (dt, input) {
    const P = CONFIG.PLAYER;
    const half = P.W / 2;
    const minCenter = P.MARGIN + half;              // 角色中心可到达的左右边界
    const maxCenter = W - P.MARGIN - half;
    const keyAx = (input.keyRight ? 1 : 0) - (input.keyLeft ? 1 : 0);

    /* 严格跟随：中心直接贴住指针，没有任何加速度/惯性。
       键盘按住时改为「把目标点按 MAX_SPEED 推过去」，所以 A、D 依然是按住持续移动 */
    if (P.STRICT_FOLLOW) {
      if (keyAx !== 0) {
        const from = input.aimX == null ? this.x + half : input.aimX;
        input.aimX = clamp(from + keyAx * P.MAX_SPEED * dt, minCenter, maxCenter);
      }
      if (input.aimX != null) {
        const dx = input.aimX - (this.x + half);
        this.x = clamp(input.aimX - half, P.MARGIN, W - P.W - P.MARGIN);
        if (dx > 0.5) this.dir = 1;
        else if (dx < -0.5) this.dir = -1;
      }
      this.vx = 0;
      this.bob += dt * P.BOB_SPEED;                 // 呼吸浮动（纯视觉）
      return;
    }

    /* 惯性模式：朝指针方向加速并限速；距离越近期望速度越小，到位后自然停住。
       按住 A/D 或 ←/→ 时临时覆盖指针（无鼠标时的备用操作）；指针未知则自然衰减。 */
    let desired;
    if (keyAx !== 0) {
      desired = keyAx * P.MAX_SPEED;
    } else if (input.aimX == null) {
      desired = null;
    } else {
      const d = input.aimX - (this.x + half);        // 指针相对角色中心的偏移
      desired = Math.abs(d) <= P.AIM_DEADZONE ? 0 : clamp(d * P.AIM_GAIN, -P.MAX_SPEED, P.MAX_SPEED);
    }

    if (desired === null) {
      this.vx *= Math.exp(-P.DAMPING * dt);
      if (Math.abs(this.vx) < 1) this.vx = 0;
    } else {
      // 只有"正在提速"才用 ACCEL，减速/反向一律用更大的 DECEL，才不会冲过头来回晃
      const speedingUp = desired !== 0 && Math.abs(desired) >= Math.abs(this.vx) &&
                         (this.vx === 0 || (desired > 0) === (this.vx > 0));
      const rate = speedingUp ? P.ACCEL : P.DECEL;
      this.vx += clamp(desired - this.vx, -rate * dt, rate * dt);
      if (desired === 0 && Math.abs(this.vx) < 1) this.vx = 0;
    }

    if (this.vx > 1) this.dir = 1;
    else if (this.vx < -1) this.dir = -1;

    this.x += this.vx * dt;
    const minX = P.MARGIN, maxX = W - P.W - P.MARGIN;
    if (this.x < minX) { this.x = minX; this.vx = 0; }
    if (this.x > maxX) { this.x = maxX; this.vx = 0; }
    this.bob += dt * P.BOB_SPEED;               // 呼吸浮动（纯视觉）
  },
};

/* =========================================================================
 * 实体容器
 * ========================================================================= */
const items = [];
const bubbles = [];

/* =========================================================================
 * FallingItem —— 掉落食物
 * ========================================================================= */
function FallingItem(type, x) {
  const cfg = CONFIG.FOOD[type];
  this.type = type;
  this.w = cfg.w;
  this.h = cfg.h;
  this.x = clamp(x, CONFIG.SPAWN.MARGIN_X, W - cfg.w - CONFIG.SPAWN.MARGIN_X);
  this.y = -cfg.h - 2;
  this.t = rand(0, Math.PI * 2);
  this.swayAmp = rand(1.5, 3.5);
  this.swayFreq = rand(1.6, 2.8);
  this.rot = 0;
  this.spin = type !== 'lime';
  this.spinAmp = rand(0.06, 0.14);
  this.curX = this.x;
  this.pass = false;      // 落点已堆满 → 不再参与堆积，直接穿过去落到屏幕底部
}

FallingItem.prototype.update = function (dt, speedMul) {
  const cfg = CONFIG.FOOD[this.type];
  this.t += dt;
  this.y += cfg.speed * speedMul * dt;
  this.curX = this.x + Math.sin(this.t * this.swayFreq) * this.swayAmp;
  if (this.spin) this.rot = Math.sin(this.t * 1.7) * this.spinAmp;
};

/* =========================================================================
 * Bubble —— 危险泡泡，从下往上，正弦左右摆动
 * ========================================================================= */
function Bubble() {
  const B = CONFIG.BUBBLE;
  this.r = randi(B.R_MIN, B.R_MAX);
  /* 体积越小摆动越猛：半径在 R_MIN~R_MAX 间线性插值到 SWAY_AMP_SMALL~SWAY_AMP_BIG，再加一点随机浮动 */
  const sizeT = B.R_MAX > B.R_MIN ? (this.r - B.R_MIN) / (B.R_MAX - B.R_MIN) : 0;
  const lo = this.r + 1, hi = W - this.r - 1;
  this.amp = Math.min(lerp(B.SWAY_AMP_SMALL, B.SWAY_AMP_BIG, sizeT) * rand(1 - B.SWAY_JITTER, 1 + B.SWAY_JITTER),
                       (hi - lo) / 2);
  // 生成位置为振幅留出余量，让整段正弦都落在画面内 —— 否则摆幅大的泡泡会一直贴在屏幕边缘不动
  this.baseX = rand(lo + this.amp, hi - this.amp);
  this.x = this.baseX;
  this.y = H + this.r + 2;
  this.speed = rand(B.SPEED_MIN, B.SPEED_MAX);
  this.freq = rand(B.SWAY_FREQ_MIN, B.SWAY_FREQ_MAX);
  this.phase = rand(0, Math.PI * 2);
  this.t = 0;
  /* 被连锁引爆点着的泡泡会先标 dead，再由 updateBubbles 统一清出数组
     （不能在递归里直接 splice，否则外层遍历的下标会错位） */
  this.dead = false;
}

Bubble.prototype.update = function (dt, speedMul) {
  this.t += dt;
  this.y -= this.speed * speedMul * dt;
  this.x = clamp(this.baseX + Math.sin(this.t * this.freq + this.phase) * this.amp,
                 this.r + 1, W - this.r - 1);
};

/**
 * 某个点是否落在圆内（青柠无敌爆泡的范围判定用）。
 *
 * 这里用「点」而不是「圆 vs 外接矩形相交」：外接矩形相交会让判定范围比画出来的
 * 圆大出半个食物（潜水艇那种 72×46 的大件能多探出 30 多像素），
 * 于是「环明明没碰到，东西却碎了」。改成判断**物品中心**之后，
 * 被清掉的东西就是「中心被环扫过」的那些 —— 特效画到哪儿，判定就到哪儿。
 */
function circleContainsPoint(cx, cy, r, x, y) {
  const dx = cx - x, dy = cy - y;
  return dx * dx + dy * dy <= r * r;
}

/**
 * 精灵（可带旋转）有没有**像素**落在圆内 —— 用来判「食物是否碰到那圈冲击波」。
 * sx/sy 是精灵中心、rot 是绘制时的旋转（与 drawItemsLayer 里的 translate + rotate 一致），
 * mask.m 是该食物精灵的不透明像素表。先拿旋转后的外接矩形把远处的直接否掉，再做逐像素判定。
 * 比「中心进圈」宽松：潜水艇这种长条只要有一角伸进圈里就算被碰到（见 eatItemsInRadius）。
 */
function spriteTouchesCircle(mask, sx, sy, rot, cx, cy, r) {
  const hw = mask.w / 2, hh = mask.h / 2;
  const c = Math.cos(rot || 0), sn = Math.sin(rot || 0);
  const ex = (mask.w * Math.abs(c) + mask.h * Math.abs(sn)) / 2;
  const ey = (mask.w * Math.abs(sn) + mask.h * Math.abs(c)) / 2;
  const nx = Math.max(sx - ex, Math.min(cx, sx + ex));
  const ny = Math.max(sy - ey, Math.min(cy, sy + ey));
  const bx = nx - cx, by = ny - cy;
  if (bx * bx + by * by > r * r) return false;                 // 外接矩形都没碰上 → 直接否
  const m = mask.m;
  for (let y = 0; y < mask.h; y++) {
    const my = y - hh;
    for (let x = 0; x < mask.w; x++) {
      if (!m[y * mask.w + x]) continue;
      const mx = x - hw;
      const dx = sx + c * mx - sn * my - cx;
      const dy = sy + sn * mx + c * my - cy;
      if (dx * dx + dy * dy <= r * r) return true;
    }
  }
  return false;
}

/* =========================================================================
 * StackSystem —— 堆积遮挡系统
 * 每个食物按自己的碰撞箱（CONFIG.FOOD 里的 hw/hh）下落就位：
 *   · 停下来的条件是「碰撞箱正下方全为实体」：取碰撞箱覆盖各列里最低的那个接触面，
 *     只要还有一列是空的就继续往下落，所以食物不会架在缝上悬空
 *   · 精灵比碰撞箱大，落定后仍会与下方食物咬合重叠 oy 像素，堆出自然堆叠而非平顶墙
 *   · surface[] 记录每列堆积体的顶面（= 该列最上面那个食物的真实像素轮廓顶部），
 *     并保证该列从这里往下是连续实心的
 *   · 绘制时先把食物精灵画好，再从每列堆顶往下把所有透明像素用上方最近的颜色填满，
 *     所以堆积体内部永远不会透出背景，又不会把食物纹理糊成一块纯色
 *   · 被青柠无敌冲撞炸到时整块移走（crush），上方悬空的堆会自己塌落重排（settle）
 * ========================================================================= */
const StackSystem = {
  surface: [],     // 每列堆积体顶面 y（H = 该列还没堆到）
  items: [],
  /* 整层重绘的开关。食物落定时是增量画进 layer 的（见 add），不会经过这里；
     只有 settle()（爆炸掏空后重排堆顶）才把它置 true，下一帧由 draw() 整屏重画一次。
     也试过「只重画被炸掉的那几列」，但堆积物的精灵是互相咬合重叠的：
     带外的食物（画得更晚、盖在上面）会被带内食物的重画顶掉，z 序就错了；
     补成「把相交的都算进来」又会顺着重叠一路扩散到整屏宽度（等于没省），
     所以这里老老实实整屏重画（实测 346 块时 ~3.6ms，一次爆炸才一次）。 */
  dirty: true,
  layer: null,

  init: function () {
    this.layer = makeCanvas(W, H, true);
    this.reset();
  },

  reset: function () {
    this.surface = new Array(COLS).fill(H);
    this.items.length = 0;
    this.dirty = false;
    if (this.layer) {
      const g = this.layer.getContext('2d');
      g.clearRect(0, 0, W, H);
    }
  },

  /** 精灵比碰撞箱每侧大出多少像素（= 相邻食物最多能重叠的像素数） */
  offOf: function (type) {
    const c = CONFIG.FOOD[type];
    return { x: (c.w - c.hw) >> 1, y: (c.h - c.hh) >> 1 };
  },

  /** 像素区间 [x, x+w) 覆盖的列范围（含端点）；堆积层按 1px 一列记录 */
  colsOf: function (x, w) {
    const a = clamp(Math.floor(x), 0, W - 1);
    const b = clamp(Math.floor(x + w - 1), a, W - 1);
    return [a, b];
  },

  /**
   * 支撑面 y：取碰撞箱覆盖各列里**最低（最靠下）**的那个接触面。
   * 食物必须「正下方全为实体」才能停住，所以只要碰撞箱范围内还有一列是空的，
   * 它就继续往下落，直到整个碰撞箱正下方都被撑住为止 —— 不会架在缝上形成悬空。
   */
  supportFor: function (x, type) {
    const c = CONFIG.FOOD[type];
    const cols = this.colsOf(Math.round(x) + this.offOf(type).x, c.hw);
    let low = -1;
    for (let i = cols[0]; i <= cols[1]; i++) {
      if (this.surface[i] > low) low = this.surface[i];
    }
    return low;
  },

  restYFrom: function (top, type) {
    const c = CONFIG.FOOD[type];
    return top >= H ? H - c.h : top - c.h + this.offOf(type).y;
  },

  /**
   * 落在该 x 时应有的 y。
   * 压在其他食物上 → 精灵整体下沉 oy 像素，与下方食物重叠 oy 像素；
   * 落到地面 → 精灵底边正好贴住屏幕底，不越界。
   */
  restYFor: function (x, type) {
    return this.restYFrom(this.supportFor(x, type), type);
  },

  /** 下落中的食物是否已经落到位 */
  landed: function (item) {
    return item.y >= this.restYFor(item.curX, item.type);
  },

  /**
   * 落点是否已经堆满：碰撞箱覆盖到的列全部升到上限线 FULL_Y 以上，
   * 就没有位置可放了 —— 这块食物不再参与堆积，改为穿过去落到屏幕底部消失。
   */
  fullAt: function (x, type) {
    return this.supportFor(x, type) <= CONFIG.STACK.FULL_Y;
  },

  /** 把食物并进堆积层；返回 false 表示这个落点已经堆满、放不下（调用方应改为「穿过去」） */
  add: function (item) {
    const c = CONFIG.FOOD[item.type];
    const x = clamp(Math.round(item.curX), 0, W - c.w);
    const y = this.restYFor(x, item.type);
    if (y + c.h <= 0) return false;           // 已经堆到屏幕上方，放不下了

    /* 补缝要补到多深？不能只补到精灵底边 —— 精灵比碰撞箱宽（潜水艇 72 vs 62），
       压在别处更高的堆上时，两侧超出的那几列底下会露出 1~8 行的空档，
       老实现是「一路补到屏幕底」才盖住的。这里取**这几列原本已经实心的最深位置**：
       再往下本来就已经是实心的了，补下去也不会改变任何像素，
       所以这个界既等价、又把整屏高的 getImageData/putImageData 压到几十行（实测 1.7ms → 0.2ms） */
    const cols = this.colsOf(x, c.w);
    let fillTo = y + c.h;
    for (let i = cols[0]; i <= cols[1]; i++) {
      if (this.surface[i] > fillTo) fillTo = this.surface[i];
    }

    const pile = { x: x, y: y, w: c.w, h: c.h, type: item.type };
    this.items.push(pile);
    this.raiseSurface(pile);      // 按真实像素轮廓抬高各列堆顶（整列透明的部分不参与）
    // 立刻把这一坨画进堆积层，并且只补实它覆盖到的那几列
    const g = this.layer.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(pileSpriteOf(item.type), x, y);
    this.fillCols(x, x + c.w - 1, fillTo);
    return true;
  },

  /**
   * 把堆积物的真实像素轮廓并进各列堆顶（整列透明的部分不参与，例如潜水艇的圆角外）。
   * 狗屎在青柠生效时会改画成巧克力，两者形状完全相同（只是配色不同），所以轮廓一致。
   * add（新落一块）与 settle（掏空后重排）共用这一份，保证两条路算出来的堆顶一模一样。
   */
  raiseSurface: function (it) {
    const c = CONFIG.FOOD[it.type];
    const sil = Assets.sil[it.type];
    const cols = this.colsOf(it.x, c.w);
    for (let i = cols[0]; i <= cols[1]; i++) {
      const lx = clamp(i - it.x, 0, c.w - 1);
      const t = sil.top[lx];
      if (t < 0) continue;
      if (it.y + t < this.surface[i]) this.surface[i] = it.y + t;
    }
  },

  /**
   * 粉碎：把「以 (cx, cy) 为心、r 为半径的圆」罩住的堆积物整块移走，返回被移走的那些
   * （调用方拿去加分 / 喷碎屑）。
   * 判定标准 = **物品中心是否在圆内**，与冲击波画出来的圆严格一致：
   * 环外的东西一个都不会碎，环内的整块都没（按单位消失，不会把一坨食物抠掉半个）。
   * 移走后按 CONFIG.STACK.SETTLE_AFTER_CRUSH 决定要不要塌落（默认不塌，原地留洞）。
   */
  crush: function (cx, cy, r) {
    const gone = [], keep = [];
    for (let i = 0; i < this.items.length; i++) {
      const it = this.items[i];
      if (circleContainsPoint(cx, cy, r, it.x + it.w / 2, it.y + it.h / 2)) gone.push(it);
      else keep.push(it);
    }
    if (!gone.length) return gone;
    this.items = keep;
    this.settle(CONFIG.STACK.SETTLE_AFTER_CRUSH);
    return gone;
  },

  /**
   * 整理堆积层：重算每个堆积物的落点、重算堆顶、标脏整层重画。
   * move = true  → 悬空的塌下来（只往下塌、不往上顶），老行为；
   * move = false → 位置一律不动，只把堆顶重算一遍、标脏重画 ——
   *                被炸开的地方就这么留着一个洞，连炸的时候画面不会一直整堆往下滑
   *                （开关见 CONFIG.STACK.SETTLE_AFTER_CRUSH）。
   * 堆顶 = 覆盖该列的所有食物轮廓顶的最小值，与处理顺序无关，重算结果稳定。
   */
  settle: function (move) {
    const list = this.items.slice().sort(function (a, b) { return b.y - a.y; });
    this.items = list;
    this.surface = new Array(COLS).fill(H);
    for (let i = 0; i < list.length; i++) {
      const it = list[i];
      if (move) {
        const rest = this.restYFor(it.x, it.type);
        if (it.y < rest) it.y = rest;
      }
      this.raiseSurface(it);
    }
    this.dirty = true;
  },

  /**
   * 只补实 [x0, x1] 这段像素列。
   * 规则：每列从堆顶往下扫，紧贴食物轮廓的地方沿用食物颜色（最多再延伸 SPILL_PX 像素，
   * 用来把衔接处的缝补上）；更深的缝按**背景在那一行的颜色**填 —— 既不会把食物颜色糊出去，
   * 也不会出现突兀的暗色块，看上去就是堆与堆之间自然的空隙，而堆积层依旧是实心不透明的。
   *
   * bottom（可选）= 只补到这一行为止。堆的不变量是「从 surface[] 往下一定是实心的」，
   * 所以新落一块时，可能出现的空缝只在那块自己覆盖的那几十行里，下面早就实心了 ——
   * add() 传 y + 精灵高 进来，把每次落地的 getImageData/putImageData 从「整屏高」
   * 压到「一块食物高」（实测 1.7ms → 0.2ms）。不传 = 补到屏幕底（全量重绘用）。
   */
  fillCols: function (x0, x1, bottom) {
    const SPILL = CONFIG.STACK.SPILL_PX;
    const bgPix = Assets.bgPix;
    const ex0 = clamp(x0, 0, W - 1);
    const ex1 = clamp(x1, 0, W - 1);
    let top = H;
    for (let x = ex0; x <= ex1; x++) {
      if (this.surface[x] < top) top = this.surface[x];
    }
    if (top >= H) return;                        // 这一段都还没堆到
    if (top < 0) top = 0;
    let bot = H;
    if (bottom !== undefined) {
      bot = Math.min(H, Math.max(top, Math.round(bottom)));
      if (bot <= top) return;                    // 这一行之上没有需要补的
    }

    const g = this.layer.getContext('2d');
    const w = ex1 - ex0 + 1, rows = bot - top;
    const img = g.getImageData(ex0, top, w, rows);
    const u32 = new Uint32Array(img.data.buffer);   // 用 32 位视图读写，比逐通道快好几倍

    for (let x = ex0; x <= ex1; x++) {
      const s = this.surface[x];
      if (s >= H) continue;                      // 这一列没有堆积物
      const y0 = (s < 0 ? 0 : s) - top;
      const cx = x - ex0;
      let last = 0, dist = 0;
      let o = y0 * w + cx;
      for (let y = y0; y < rows; y++, o += w) {
        const v = u32[o];
        if (v >>> 24 > 8) { last = v; dist = 0; continue; }   // 食物像素：记住它的颜色
        dist++;
        u32[o] = (last !== 0 && dist <= SPILL) ? last : bgPix[(top + y) * W + x];
      }
    }
    g.putImageData(img, ex0, top);
  },

  /** 全量重绘：清空后重画所有食物精灵，再从最低的堆顶补实到屏幕底（仅当 dirty 为真时执行） */
  draw: function () {
    if (!this.dirty) return;
    const g = this.layer.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, W, H);
    for (let i = 0; i < this.items.length; i++) {
      const it = this.items[i];
      g.drawImage(pileSpriteOf(it.type), it.x, it.y);
    }
    let lo = -1, hi = -1;
    for (let i = 0; i < COLS; i++) {
      if (this.surface[i] < H) { if (lo < 0) lo = i; hi = i; }
    }
    if (lo >= 0) this.fillCols(lo, hi);
    this.dirty = false;
  },
};

/* =========================================================================
 * 青柠效果
 * ========================================================================= */
function limeActive() { return GameState.limeTimer > 0; }

/** 狗屎在青柠效果期间显示为巧克力 */
function displayTypeOf(type) {
  if (type === 'poop' && limeActive()) return 'choco';
  return type;
}

/** 吃到某种食物该播哪个音效（按「显示出来的样子」选：青柠期的狗屎已经变成冰淇淋了） */
function eatSoundOf(type) {
  const t = displayTypeOf(type);
  return t === 'lime' ? 'lemon' : t === 'choco' ? 'bing' : t === 'poop' ? 'shit' : 'eat';
}

/**
 * 效果只剩 BLINK_AT 秒时，狗屎/巧克力开始闪烁预警：
 * 在「巧克力」与「狗屎」两种外观之间来回切换，提示巧克力马上要变回狗屎。
 * 相位由倒计时驱动（走固定步长），所以任何刷新率下闪烁快慢都一致。
 * 金色泡泡也用同一条相位闪烁（提示无敌即将结束），两种闪烁因此是同步的。
 */
function swirlBlinkOn() {
  if (!limeActive() || GameState.limeTimer > CONFIG.LIME.BLINK_AT) return false;
  return Math.floor(GameState.limeTimer * CONFIG.LIME.BLINK_HZ * 2) % 2 === 0;
}

/** 这一帧实际要画的精灵（叠加上闪烁相位） */
function spriteTypeOf(type) {
  const t = displayTypeOf(type);
  if (t === 'choco' && swirlBlinkOn()) return 'poop';
  return t;
}

/**
 * 这一帧的泡泡是不是金色的。
 * 青柠效果期间是金色的（人物无敌，撞泡泡不死亡）；效果只剩 BLINK_AT 秒时跟着快速闪烁，
 * 提示「无敌要结束了，马上又会变成致命泡泡」—— 用的是和狗屎↔巧克力同一套相位，
 * 所以两种闪烁是同步的。
 */
function bubbleGoldOn() {
  return CONFIG.LIME.CRUSH.ENABLED && limeActive() && !swirlBlinkOn();
}

/** 这个泡泡该画哪张图：金色 = 可以撞，白青 = 碰到必死 */
function bubbleSpriteOf(b) {
  return bubbleGoldOn() ? Assets.bubbleGold[b.r] : Assets.bubble[b.r];
}

/** 堆积层里该画哪个精灵：统一走「灰蓝调 + 黑勾边」版本。
    注意：**已经堆到底部的食物不再受青柠效果影响** —— 堆着的狗屎永远是狗屎，不会变成巧克力
    （只有还在下落的狗屎才会随青柠效果变色，所以这里直接按原始类型取图，不走 spriteTypeOf） */
function pileSpriteOf(type) { return Assets.foodPile[type]; }

/** 吃到某食物应得的分（狗屎在效果期间 = 巧克力 +500） */
function scoreOf(type) {
  return CONFIG.FOOD[displayTypeOf(type)].score;
}

/**
 * 被泡泡爆炸清掉的东西该给多少分。
 * 规则：**只加分，绝不扣分** —— 狗屎本身是 -50，但「被炸碎」不该算玩家吃到，
 * 所以这里一律夹到 0 以上（青柠期它显示成冰淇淋，本来就已经是 +500，不受影响）。
 * 玩家自己张嘴吃到的狗屎仍然照旧 -50，那是游戏规则本身。
 */
function blastScoreOf(type) {
  return Math.max(0, scoreOf(type));
}

/* =========================================================================
 * Spawner —— 加权随机 + 难度曲线
 * ========================================================================= */
const Spawner = {
  foodTimer: 0,
  bubbleTimer: 0,
  subTimer: 0,
  friesTimer: 0,

  reset: function () {
    this.foodTimer = 0.45;
    this.bubbleTimer = CONFIG.SPAWN.BUBBLE_INTERVAL_START * 0.8;
    this.subTimer = 0;          // 0 → SUB_DELAY 一到就立刻出第一个潜水艇
    this.friesTimer = CONFIG.SPAWN.FRIES_INTERVAL;   // 第一个薯条在开局一个间隔之后
    this.limeSince = 0;         // 距上一个青柠过了多久（空窗保护用，见 CONFIG.SPAWN.LIME_MAX_GAP）
  },

  /** 难度进度 0~1（线性，只作为其它曲线的输入） */
  progress: function () {
    return clamp(GameState.elapsed / CONFIG.SPAWN.RAMP_TIME, 0, 1);
  },

  /** 缓动后的难度进度：所有「随时间变密」的曲线都走它（见 smoothStep） */
  eased: function () {
    return smoothStep(this.progress());
  },

  foodInterval: function () {
    return lerp(CONFIG.SPAWN.FOOD_INTERVAL_START, CONFIG.SPAWN.FOOD_INTERVAL_END, this.eased());
  },

  bubbleInterval: function () {
    return lerp(CONFIG.SPAWN.BUBBLE_INTERVAL_START, CONFIG.SPAWN.BUBBLE_INTERVAL_END, this.eased());
  },

  /** 薯条间隔：跟着难度从 FRIES_INTERVAL 收到 FRIES_INTERVAL_END（两者填一样就是全程固定） */
  friesInterval: function () {
    return lerp(CONFIG.SPAWN.FRIES_INTERVAL, CONFIG.SPAWN.FRIES_INTERVAL_END, this.eased());
  },

  /** 速度倍率：基础速度 × (1 + elapsedTime / 45)，带上限 */
  speedMul: function () {
    return Math.min(CONFIG.DIFF.SPEED_MAX,
                    1 + GameState.elapsed / CONFIG.DIFF.SPEED_RAMP_DIV);
  },

  /**
   * 潜水艇刷新频率（个/秒）：SUB_DELAY 秒之前恒为 0（完全不生成）；
   * 之后先花 SUB_RISE 秒从 0 平滑淡入到 SUB_RATE_START（老实现是一步跳上去的），
   * 再一路平滑涨到 SUB_RATE_CAP，到 RAMP_TIME 正好吃满、之后保持。
   * 由此整条曲线处处连续：没有阶梯（老实现每 5 秒 ×1.15）、没有台阶、也没有「到点突然封顶」。
   */
  subRate: function () {
    const S = CONFIG.SPAWN;
    const t = GameState.elapsed;
    if (t < S.SUB_DELAY) return 0;
    const rise = Math.max(0, S.SUB_RISE);
    if (rise > 0 && t < S.SUB_DELAY + rise) {
      return lerp(0, S.SUB_RATE_START, smoothStep((t - S.SUB_DELAY) / rise));   // 淡入段
    }
    return lerp(S.SUB_RATE_START, S.SUB_RATE_CAP, this.eased());
  },

  /**
   * 狗屎权重曲线（全程连续，没有任何台阶）：
   *   · POOP_DELAY 之前恒为 0（完全不生成）；
   *   · 之后用 POOP_RISE 秒平滑地「淡入」到 POOP_BASE_WEIGHT（老实现是瞬间跳上去的）；
   *   · 再一路平滑（S 形）涨到 POOP_BASE_WEIGHT + WEIGHTS_END.poop —— 也就是 90 秒处的终值。
   */
  poopWeight: function () {
    const SP = CONFIG.SPAWN, t = GameState.elapsed;
    if (t < SP.POOP_DELAY) return 0;
    const rise = Math.max(0, SP.POOP_RISE);
    if (rise > 0 && t < SP.POOP_DELAY + rise) {
      return SP.POOP_BASE_WEIGHT * smoothStep((t - SP.POOP_DELAY) / rise);   // 淡入段
    }
    const span = SP.RAMP_TIME - SP.POOP_DELAY - rise;
    const k = span > 0 ? clamp((t - SP.POOP_DELAY - rise) / span, 0, 1) : 1;
    return SP.POOP_BASE_WEIGHT + SP.WEIGHTS_END.poop * smoothStep(k);        // 主爬升段
  },

  /** 潜水艇 / 薯条 / 狗屎 三者权重之和（不含青柠），用于反解青柠权重 */
  baseWeight: function () {
    const k = this.progress(), S = CONFIG.SPAWN.WEIGHTS_START, E = CONFIG.SPAWN.WEIGHTS_END;
    return lerp(S.sub, E.sub, k) + lerp(S.fries, E.fries, k) + this.poopWeight();
  },

  /**
   * 青柠权重曲线：LIME_DELAY 秒之前恒为 0（完全不出现）；
   * 之后平均出现间隔从 LIME_START_INTERVAL 线性拉长到 LIME_MIN_INTERVAL（在 LIME_RAMP_END 秒），
   * 之后保持不变。
   * 若只固定权重，整体食物生成频率随时间升高会把青柠的「实际频率」又带上去；
   * 所以这里先算目标间隔对应的出现占比，再由占比反解权重，保证间隔单调变长后稳定不变。
   */
  limeWeight: function () {
    const SP = CONFIG.SPAWN, t = GameState.elapsed;
    if (t < SP.LIME_DELAY) return 0;
    const span = SP.LIME_RAMP_END - SP.LIME_DELAY;
    const k = span > 0 ? clamp((t - SP.LIME_DELAY) / span, 0, 1) : 1;
    const interval = lerp(SP.LIME_START_INTERVAL, SP.LIME_MIN_INTERVAL, smoothStep(k)); // 目标平均间隔（秒）
    const share = clamp(this.foodInterval() / interval, 0, 0.9);            // 需要的出现占比
    return share / (1 - share) * this.baseWeight();                        // 由占比反解权重
  },

  /** 按时间插值的加权随机：随时间提高潜水艇权重、降低薯条权重；
      狗屎整条曲线单独走 poopWeight()，青柠单独走 limeWeight() */
  pickType: function () {
    const k = this.progress();
    const S = CONFIG.SPAWN.WEIGHTS_START;
    const E = CONFIG.SPAWN.WEIGHTS_END;
    const weights = {};
    let total = 0;
    for (const key in S) {
      let w = lerp(S[key], E[key], k);
      if (key === 'lime') w = this.limeWeight();
      else if (key === 'poop') w = this.poopWeight();
      weights[key] = w;
      total += w;
    }
    let r = Math.random() * total;
    for (const key in weights) {
      r -= weights[key];
      if (r <= 0) return key;
    }
    return 'fries';
  },

  /**
   * 潜水艇的下一次间隔（秒）：平均值仍然是 1/rate，但每次重新抽 ——
   * SUB_RANDOM=0 时就是固定间隔（旧行为）；=1 时间隔服从指数分布（泊松过程），
   * 于是后期同样是「平均 1 秒 1 个」，但会出现连出两三个和一段空档，不再是机械的节拍。
   * 指数分布的长尾按 SUB_RANDOM_MIN/MAX 限幅。
   */
  subGap: function (rate) {
    const S = CONFIG.SPAWN;
    const mean = 1 / rate;
    if (S.SUB_RANDOM <= 0) return mean;
    const u = Math.min(1, Math.max(1e-9, Math.random()));
    const pois = -Math.log(u);                 // 均值 1 的指数分布
    return mean * (1 + (clamp(pois, S.SUB_RANDOM_MIN, S.SUB_RANDOM_MAX) - 1) * S.SUB_RANDOM);
  },

  update: function (dt) {
    const mul = this.speedMul();

    /* 青柠空窗保护：距上一个青柠已经超过 LIME_MAX_GAP 秒，就把下一个空位直接给它。
       正常情况下青柠仍按权重随机出（平均 10 秒/个），这里只管住「长时间一个都没有」的尾部 */
    this.limeSince += dt;
    const forceLime = CONFIG.SPAWN.LIME_MAX_GAP > 0 &&
                      GameState.elapsed >= CONFIG.SPAWN.LIME_DELAY &&
                      this.limeSince >= CONFIG.SPAWN.LIME_MAX_GAP;

    this.foodTimer -= dt;
    if (this.foodTimer <= 0) {
      this.foodTimer += this.foodInterval();
      if (this.foodTimer < 0) this.foodTimer = this.foodInterval();
      const type = forceLime ? 'lime' : this.pickType();
      // 潜水艇和薯条都改由各自的专属计时器生成，所以这里把抽到的那两格空掉。
      // 因为 pickType 的概率表没变，狗屎/青柠的刷新节奏与原来完全一致。
      if (type !== 'sub' && type !== 'fries') {
        const w = CONFIG.FOOD[type].w;
        items.push(new FallingItem(type, rand(0, W - w)));
        if (type === 'lime') this.limeSince = 0;
      }
    }

    // 潜水艇：独立计时器，平均频率按 subRate() 走，间隔带随机（见 subGap）
    const subRate = this.subRate();
    if (subRate > 0) {
      this.subTimer -= dt;
      if (this.subTimer <= 0) {
        // 反成堆·闸一：间隔同时受硬下限和硬上限约束（上限见 SUB_GAP_MAX 的说明）
        const gap = clamp(this.subGap(subRate), CONFIG.SPAWN.SUB_MIN_GAP, CONFIG.SPAWN.SUB_GAP_MAX);
        this.subTimer += gap;
        if (this.subTimer < 0) this.subTimer = gap;
        let flying = 0;                                                       // 反成堆·闸二：在飘的条数
        for (let i = 0; i < items.length; i++) if (items[i].type === 'sub') flying++;
        if (flying < CONFIG.SPAWN.SUB_MAX_FLIGHT) {
          items.push(new FallingItem('sub', rand(0, W - CONFIG.FOOD.sub.w)));
        }
      }
    }

    // 薯条：独立计时器，间隔跟着难度从 FRIES_INTERVAL 收到 FRIES_INTERVAL_END
    this.friesTimer -= dt;
    if (this.friesTimer <= 0) {
      const gap = this.friesInterval() * (1 + CONFIG.SPAWN.FRIES_JITTER * (Math.random() * 2 - 1));
      this.friesTimer += Math.max(0.05, gap);
      if (this.friesTimer < 0) this.friesTimer = Math.max(0.05, gap);
      items.push(new FallingItem('fries', rand(0, W - CONFIG.FOOD.fries.w)));
    }

    this.bubbleTimer -= dt;
    if (this.bubbleTimer <= 0) {
      this.bubbleTimer += this.bubbleInterval();
      if (this.bubbleTimer < 0) this.bubbleTimer = this.bubbleInterval();
      bubbles.push(new Bubble());
    }

    return mul;
  },
};

/* =========================================================================
 * 特效
 * ========================================================================= */
function spawnDeathParticles() {
  const D = CONFIG.DEATH;
  const S = CONFIG.PLAYER.RAW_W / 24;   // 粒子尺度跟着角色大小走（24px 时代的角色对应 1）
  const pal = PLAYER_PALETTES[playerPalIndex()];
  const cx = Player.x + CONFIG.PLAYER.W / 2;
  const cy = Player.y + CONFIG.PLAYER.H / 2;
  const colors = [pal.main, pal.shade, pal.dark, '#ffffff'];
  for (let i = 0; i < D.PARTICLE_COUNT * S; i++) {
    const a = rand(0, Math.PI * 2);
    const sp = rand(40, 210) * S;
    GameState.particles.push({
      x: cx, y: cy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 60,
      life: D.PARTICLE_LIFE * rand(0.6, 1.15),
      max: D.PARTICLE_LIFE,
      size: randi(1, 3) * S,
      color: colors[randi(0, colors.length - 1)],
    });
  }
}

/* ── 青柠无敌冲撞：泡泡爆开的闪光 + 堆积物粉碎的碎屑 ── */

/** 泡泡爆开本身喷出的闪光碎屑（白 + 青柠期角色的高光/主色/暗部，与范围环同色系） */
function spawnBubblePopParticles(b) {
  const C = CONFIG.LIME.CRUSH;
  const pal = PLAYER_PALETTES[PAL_LIME];
  const colors = ['#ffffff', pal.hi, pal.main, pal.shade];
  const n = Math.min(C.POP_PARTICLES, Math.max(0, C.PARTICLE_CAP - GameState.particles.length));
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(30, 150);
    GameState.particles.push({
      x: clamp(b.x + Math.cos(a) * b.r * 0.7, 0, W), y: clamp(b.y + Math.sin(a) * b.r * 0.7, 0, H),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: C.POP_LIFE * rand(0.7, 1.15),
      max: C.POP_LIFE,
      size: randi(1, 2),
      color: colors[randi(0, colors.length - 1)],
    });
  }
}

/** 每个被粉碎的堆积物喷一小撮碎屑，颜色直接从该食物的堆积层精灵里取样 */
function spawnCrushParticles(gone) {
  const C = CONFIG.LIME.CRUSH;
  for (let i = 0; i < gone.length; i++) {
    const it = gone[i];
    const pal = (Assets.pileColors && Assets.pileColors[it.type]) || ['#9fb0d0'];
    for (let k = 0; k < C.DEBRIS_PER_ITEM; k++) {
      if (GameState.particles.length >= C.PARTICLE_CAP) return;
      const a = rand(0, Math.PI * 2), sp = rand(20, 110);
      GameState.particles.push({
        x: rand(it.x, it.x + it.w), y: rand(it.y, it.y + it.h),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
        life: C.DEBRIS_LIFE * rand(0.6, 1.2),
        max: C.DEBRIS_LIFE,
        size: randi(1, 2),
        color: pal[randi(0, pal.length - 1)],
      });
    }
  }
}

/**
 * 炸碎物品音效（broken）的门控：一次触发最多响一声。
 * 「碎了东西」包含两种 —— 圈内的堆积物整块粉碎、圈内的下落食物被炸掉。
 * SOUND_ONCE=false 时每碎一次都响（连锁会在同一帧里叠好几个，声音会变响发糊）。
 */
function playBrokenOnce() {
  if (CONFIG.LIME.CRUSH.CHAIN.SOUND_ONCE && GameState.brokenSfxDone) return;
  GameState.brokenSfxDone = true;
  Sound.playSfx('broken');
}

/**
 * 把爆开圈内还没吃掉的下落食物一并吃掉（「视作被角色吃掉」）：
 * 分数按「看到的样子」算（青柠期的狗屎已经是冰淇淋 → +500），并摆出吃东西表情；
 * 音效整批只放一声（一次吃掉十几个的话，逐条播会糊成一片噪音）。
 * 判定用「食物**像素**碰到圈就算」（见 spriteTouchesCircle），比堆积物那边的「中心进圈」宽松：
 * 爆开圈只有 46~63px，而炸的那一瞬间食物平均还在 116px 外，中心进圈几乎永远不触发；
 * 放宽到像素碰到圈，至少「明明贴着圈边却没事」的情况不会再出现。
 * 返回被吃掉的那些，调用方拿去喷碎屑。
 */
function eatItemsInRadius(cx, cy, r, withSound) {
  const eaten = [];
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    const mask = Assets.mask.food[spriteTypeOf(it.type)];
    /* 中心取「实际画出来的位置」：会转的食物按 round(curX + w/2) 摆中心，
       青柠不转、按 round(curX) 摆左上角（与 drawItemsLayer 完全一致） */
    const ix = it.spin ? Math.round(it.curX + it.w / 2) : Math.round(it.curX) + it.w / 2;
    const iy = it.spin ? Math.round(it.y + it.h / 2) : Math.round(it.y) + it.h / 2;
    if (!spriteTouchesCircle(mask, ix, iy, it.spin ? it.rot : 0, cx, cy, r)) continue;
    items.splice(i, 1);
    eaten.push({ x: it.curX, y: it.y, w: it.w, h: it.h, type: it.type });
    addScore(blastScoreOf(it.type));                 // 只加分不扣分（狗屎按 0 算，见 blastScoreOf）
    if (it.type === 'lime') GameState.limeTimer = CONFIG.LIME.DURATION;   // 视作真吃到 → 重置/延长
  }
  if (!eaten.length) return eaten;
  GameState.eatTimer = CONFIG.PLAYER.EAT_FRAME_TIME;                      // 张嘴（吃东西表情）
  /* 一批只播一声，按「最值得听的那个」挑：青柠 > 冰淇淋 > 狗屎 > 普通 */
  let key = 'eat';
  for (let i = 0; i < eaten.length; i++) {
    if (eaten[i].type === 'lime') { key = 'lemon'; break; }
    const t = spriteTypeOf(eaten[i].type);
    if (t === 'choco') key = 'bing';
    else if (t === 'poop' && key !== 'bing') key = 'shit';
  }
  if (withSound !== false) Sound.playSfx(key);   // 连锁的那几炸不重复出声（见 CHAIN.EAT_SOUND）
  return eaten;
}

/**
 * 青柠无敌期撞到泡泡：泡泡爆开一圈 —— 圈内的堆积物整块粉碎（每个 +CRUSH.SCORE）、
 * 圈内还没吃掉的下落食物一并算作被吃掉、**圈里的其它泡泡会被连锁引爆**（见 CHAIN）。
 * 第一炸（depth 0）的圆心钉在角色身上：泡泡在哪儿撞上不重要，炸的是「我周围」；
 * 连锁的那几炸各自以「被点着的那个泡泡」为圆心原地开花，火苗才能一圈圈往外传。
 * 圈里什么都没有时也会放这一圈光环 —— 等于告诉玩家「范围到这儿，只是这儿没东西」。
 */
function crushBubble(b, depth, withSound) {
  const C = CONFIG.LIME.CRUSH;
  const d = depth || 0;
  /* 自己也标 dead：否则两颗泡泡互相在对方圈里时，会顺着链把已经炸过的那颗再炸一遍
     （那里会多出一圈重叠的光环、SOUND_ONCE=false 时还会多响一声 bubble） */
  b.dead = true;
  if (d === 0) {                                                             // 每次触发重置连锁预算与音效记号
    GameState.chainCount = 0;
    GameState.popSfxDone = false;
    GameState.brokenSfxDone = false;
  }
  const once = C.CHAIN.SOUND_ONCE;
  if (!once || !GameState.popSfxDone) {                                      // 泡泡炸开那一下
    GameState.popSfxDone = true;
    Sound.playSfx('bubble');
  }
  const R = C.R_BASE + b.r * C.R_PER;                                        // 爆开半径：环画到哪儿就清到哪儿
  const atPlayer = d === 0 && C.CENTER_ON_PLAYER;
  const cx = atPlayer ? Player.x + CONFIG.PLAYER.W / 2 : b.x;
  const cy = atPlayer ? Player.y + CONFIG.PLAYER.H / 2 : b.y;
  /* 这里只「点着」这一炸，不当场清场：真正的粉碎 / 吃东西 / 连锁全部交给 sweepBlast，
     由它每帧跟着环的当前半径清 —— 判定与画面因此永远一致（旧实现是当场按最大半径清完，
     画面上环才扩到 8px，40px 外的东西已经没了，之后整段动画里画面一动不动）。
     环本身带上 depth（连锁层数上限）与 withSound（连锁那几炸不重复出吃东西音效）。 */
  spawnBlast(cx, cy, atPlayer ? Math.max(4, b.r * 0.5) : Math.max(3, b.r), R,
             { depth: d, withSound: withSound, ateSfxDone: false });
  spawnBubblePopParticles(b);             // 泡泡本身还是在它自己的位置炸开（不是清场，只是碎屑）
}

function updateParticles(dt) {
  const D = CONFIG.DEATH;
  for (let i = GameState.particles.length - 1; i >= 0; i--) {
    const p = GameState.particles[i];
    p.vy += D.GRAVITY * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) GameState.particles.splice(i, 1);
  }
}

/* ── 爆开范围指示环 ── */

/** 半径随时间的变化：从泡泡半径先快后慢地扩到 rMax，之后停在 rMax（用缓出，看着像被"推"出去） */
function blastRadius(bl) {
  const C = CONFIG.LIME.CRUSH;
  const k = clamp((bl.max - bl.life) / Math.max(0.001, C.WAVE_EXPAND), 0, 1);
  return lerp(bl.r0, bl.r, 1 - Math.pow(1 - k, 3));
}

/**
 * 爆开范围环的配色：直接取青柠期角色的配色，所以「特效的颜色」和「人的颜色」永远一致
 * （改 PLAYER_PALETTES[PAL_LIME] 时特效自动跟着变；想固定成别的颜色就把这里写死成 '#rrggbb'）
 */
function blastPal() {
  const pal = PLAYER_PALETTES[PAL_LIME];
  return { ring: pal.main, edge: pal.hi, flash: pal.hi };
}

/**
 * 在爆点放一圈冲击波：r0 = 起始半径，rMax = 扫到的最大半径（= 真正清算的范围）。
 * wave = { depth, withSound, ateSfxDone } 时这圈还要负责清场（见 sweepBlast）；不传就是纯特效环。
 *   depth       连锁层数（对照 CHAIN.MAX_DEPTH）
 *   withSound   连锁那几炸不出吃东西音效（对照 CHAIN.EAT_SOUND）
 *   ateSfxDone  这一炸是否已经出过吃东西音效（一圈会分好几帧吃到东西，只出声一次）
 */
function spawnBlast(x, y, r0, rMax, wave) {
  const C = CONFIG.LIME.CRUSH;
  GameState.blasts.push({ x: x, y: y, r0: Math.max(1, r0), r: rMax,
    life: C.WAVE_LIFE, max: C.WAVE_LIFE, wave: wave || null });
}

/**
 * 一圈冲击波「扫」到哪儿就清到哪儿：
 * 半径直接用画环的 blastRadius()，于是判定范围和画面上那圈环是同一个数，不可能对不上。
 *  · 圈内的堆积物整块粉碎（+SCORE）；
 *  · 圈内还没吃掉的下落食物算被吃掉（像素碰到圈就算，见 EAT_ITEMS）；
 *  · 圈里的其它泡泡被连锁点着（各自以自己为圆心再扫一圈）。
 * 被清掉的东西会立刻从数组里消失，所以每帧整圈重扫不会重复计分 ——
 * 反而顺带做到了「只要环还在，新掉进圈里的东西照样被清」。
 * 环停在最大半径后还会再亮一会儿，这期间也一直在扫（玩家看到圈还在，就认为那里还是危险区）。
 */
function sweepBlast(bl) {
  const C = CONFIG.LIME.CRUSH, w = bl.wave;
  const r = blastRadius(bl);
  if (!(r > 0)) return;
  const cx = bl.x, cy = bl.y;

  const gone = StackSystem.crush(cx, cy, r);
  if (gone.length) {
    spawnCrushParticles(gone);
    addScore(gone.length * C.SCORE);      // 每个被炸碎的堆积物 +SCORE；狗屎也一样，不会扣分
    playBrokenOnce();                     // 真的碎了东西才响（空炸就只出上面的泡泡音）
  }
  if (C.EAT_ITEMS) {
    /* 音效按「炸」门控，不按帧：一圈扫下来会分好几帧吃到东西，
       每帧都响就是连着八声「吃东西」（实测），所以这一炸只出第一声。
       连锁的那几炸是否出声仍由 CHAIN.EAT_SOUND 决定（w.withSound）。 */
    const eaten = eatItemsInRadius(cx, cy, r, w.withSound && !w.ateSfxDone);
    if (eaten.length) {
      w.ateSfxDone = true;
      spawnCrushParticles(eaten);
      playBrokenOnce();                   // 被炸掉的也算「碎掉」：和堆积物共用一声 broken
    }
  }

  /* 连锁：把这一炸圈里的其它泡泡也点着（各自以自己为圆心再扫一圈，火苗一圈圈往外传） */
  const CH = C.CHAIN;
  if (!CH || !CH.ENABLED || w.depth >= CH.MAX_DEPTH) return;
  for (let i = 0; i < bubbles.length; i++) {
    const o = bubbles[i];
    if (o.dead) continue;                                                    // 已经点着的（含刚被点着的）不再重复点
    if (GameState.chainCount >= CH.MAX_TOTAL) break;                         // 预算用完就停，防止炸穿屏幕
    if (!circleContainsPoint(cx, cy, r, o.x, o.y)) continue;                 // 判定口径与环一致：泡泡中心在圈内
    GameState.chainCount++;
    crushBubble(o, w.depth + 1, CH.EAT_SOUND);
  }
}

/** 推进所有冲击波：每帧先掉寿命，还活着的就按当前半径扫一遍 */
function updateBlasts(dt) {
  const arr = GameState.blasts;
  for (let i = arr.length - 1; i >= 0; i--) {
    const bl = arr[i];
    bl.life -= dt;
    if (bl.life <= 0) { arr.splice(i, 1); continue; }
    if (!bl.wave) continue;
    FAULT.run('逻辑·冲击波清扫', function () { sweepBlast(bl); });
  }
}

/** 爆开范围：一圈青绿环 + 最外 1px 亮边 + 开头一闪的实心淡光盘（配色见 blastPal） */
function drawBlastsLayer(g) {
  const C = CONFIG.LIME.CRUSH;
  const pal = blastPal();
  resetDraw(g);
  for (let i = 0; i < GameState.blasts.length; i++) {
    const bl = GameState.blasts[i];
